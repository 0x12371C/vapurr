# Applies to every vapurr gnu build, including dist/vapurr.zip.
# Remap home + cargo registry so release bins never ship C:\Users\<you> paths.
# Both slash styles ? rustc/file! can emit either.
[target.x86_64-pc-windows-gnu]
rustflags = [
  "-C", "target-cpu=x86-64-v2",
  "--remap-path-prefix", "C:\\Users\\jfren\\vapurr=.",
  "--remap-path-prefix", "C:\\Users\\jfren\\.cargo=/cargo",
  "--remap-path-prefix", "C:\\Users\\jfren=/home",
  "--remap-path-prefix", "C:/Users/jfren/vapurr=.",
  "--remap-path-prefix", "C:/Users/jfren/.cargo=/cargo",
  "--remap-path-prefix", "C:/Users/jfren=/home",
]
