[profile.default]
src = "."
out = "out-forge"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
test = "test"
skip = [
  "HouseLp.sol",
  "HouseSwap.sol",
  "KetList.sol",
  "MockUsdg.sol",
  "Outbid.sol",
  "PnsRegistry.sol",
  "PusdLoop.sol",
  "PusdMarket.sol",
]

[fmt]
line_length = 120
