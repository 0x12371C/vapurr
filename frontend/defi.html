<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>DeFi</title>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <link rel="stylesheet" href="/defi-surface.css"/>
  <style>
    html, body { height: 100%; }
    body {
      overflow: auto;
      position: relative;
      background: var(--color-void);
    }
    .aura {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden;
    }
    .aura canvas { width: 100%; height: 100%; display: block; }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 22px 96px;
      position: relative;
      z-index: 1;
    }
    .hero { margin-bottom: 32px; }
    .hero .mono { color: var(--color-lime); margin-bottom: 12px; }
    .hero h1 {
      font-size: clamp(52px, 11vw, 76px);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 0.9;
    }
    .lede {
      margin-top: 14px;
      color: var(--color-muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 32em;
    }
    .lede b { color: var(--color-snow); font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
    }
    .door {
      text-align: left;
      height: auto;
      min-height: 132px;
      padding: 18px 18px 16px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--color-steel) 50%, transparent);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid color-mix(in srgb, var(--color-snow) 8%, transparent);
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      box-shadow: 0 14px 40px color-mix(in srgb, #000 18%, transparent);
      transition:
        transform 0.2s var(--ease-out, cubic-bezier(0.22, 1, 0.36, 1)),
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.2s ease;
    }
    .door:hover {
      background: color-mix(in srgb, var(--color-forest) 52%, transparent);
      border-color: color-mix(in srgb, var(--color-lime) 32%, transparent);
      transform: translateY(-3px);
      box-shadow:
        0 20px 48px color-mix(in srgb, #000 28%, transparent),
        0 0 0 1px color-mix(in srgb, var(--color-lime) 18%, transparent);
    }
    .door:active { transform: translateY(-1px) scale(0.99); }
    .door .mono { color: var(--color-lime); }
    .door b {
      display: block;
      margin-top: 10px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }
    .door .hint {
      margin-top: 8px;
      color: var(--color-muted);
      font-size: 12px;
      line-height: 1.45;
      max-width: 26em;
    }
    .door.span {
      grid-column: 1 / -1;
      min-height: 110px;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .door.span .copy { min-width: 0; }
    .door.span .arrow {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid color-mix(in srgb, var(--color-lime) 35%, transparent);
      color: var(--color-lime);
      font-size: 18px;
      font-weight: 600;
    }
    .sec {
      margin: 28px 2px 12px;
      color: var(--color-lime);
      letter-spacing: 0.14em;
    }
    html[data-theme="light"] .door {
      background: color-mix(in srgb, var(--color-steel) 84%, transparent);
      box-shadow: var(--shadow-soft);
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"><canvas id="shader"></canvas></div>
  <div class="wrap">
    <div class="hero">
      <div class="mono">defi</div>
      <h1>On chain.</h1>
      <p class="lede">Swap, cash, bonds, and the house desk — one surface. Live quotes. Sign on this device.</p>
    </div>

    <div class="mono sec">core</div>
    <div class="grid">
      <button class="door" type="button" data-go="vapurr://swap">
        <span class="mono">01 · Swap</span>
        <b>Swap</b>
        <span class="hint">Full route. House kickback in $VAPURR. Simulate, then sign.</span>
      </button>
      <button class="door" type="button" data-go="vapurr://pusd">
        <span class="mono">02 · Cash</span>
        <b>$PUSD / Oliver</b>
        <span class="hint">The dollar rail. Mint, save, and Oliver credit in one place.</span>
      </button>
      <button class="door" type="button" data-go="vapurr://bonds">
        <span class="mono">03 · Bonds</span>
        <b>Bonds</b>
        <span class="hint">ETH · USDG · stocks. Discount gV after a wait. CDs live by default.</span>
      </button>
      <button class="door" type="button" data-go="vapurr://house">
        <span class="mono">04 · House</span>
        <b>House</b>
        <span class="hint">wgV / $PUSD desk. Equity meets cash — not peg defense.</span>
      </button>
    </div>

    <div class="mono sec">more</div>
    <div class="grid">
      <button class="door" type="button" data-go="vapurr://stake">
        <span class="mono">Equity</span>
        <b>Stake</b>
        <span class="hint">Hold gV. Fed rebase. Wrap to wgV before House.</span>
      </button>
      <button class="door" type="button" data-go="vapurr://bridge">
        <span class="mono">Bridge</span>
        <b>Bridge</b>
        <span class="hint">Into Robinhood Chain. Best simulated net. Quote, then sign.</span>
      </button>
      <button class="door" type="button" data-go="vapurr://vapurrbid">
        <span class="mono">Bid</span>
        <b>vapurrbid</b>
        <span class="hint">Pay $PUSD. Take the rank.</span>
      </button>
      <button class="door" type="button" data-go="vapurr://pns">
        <span class="mono">PNS</span>
        <b>.hood</b>
        <span class="hint">One name. Yours.</span>
      </button>
      <button class="door span" type="button" data-go="vapurr://scan?tab=liq">
        <div class="copy">
          <span class="mono">Scan</span>
          <b>Liquidity</b>
          <span class="hint">Chain map. House book is VAPURR/PUSD only.</span>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
      <button class="door span" type="button" data-go="vapurr://ketcharts">
        <div class="copy">
          <span class="mono">Charts</span>
          <b>Ketcharts</b>
          <span class="hint">ETH BTC SOL. Live candles.</span>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </div>
  </div>
  <script src="/ipc.js"></script>
  <script src="/shader.js"></script>
  <script>
    if (window.startShader) startShader(document.getElementById("shader"));
    document.querySelectorAll("[data-go]").forEach(function (el) {
      el.onclick = function () { vapurr.go(el.getAttribute("data-go")); };
    });
  </script>
</body>
</html>
