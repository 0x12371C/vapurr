<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <style>
    body { overflow: auto; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px 56px; }
    .amt { font-size: 36px; font-weight: 600; margin: 8px 0 4px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .switch {
      width: 44px; height: 24px; border-radius: 999px;
      background: var(--color-steel); border: 1px solid var(--color-forest);
      position: relative; cursor: pointer;
    }
    .switch.on { background: var(--color-forest); border-color: var(--color-lime); }
    .knob {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--color-muted); position: absolute; top: 2px; left: 3px;
    }
    .switch.on .knob { left: 21px; background: var(--color-lime); }
    .list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .item span { color: var(--color-muted); font-size: 12px; }
    .hosts { color: var(--color-muted); font-size: 13px; line-height: 1.45; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mono" style="color:var(--color-lime);margin-bottom:8px">EARN</div>
    <h1>You get paid to browse.</h1>
    <p>Chrome sold your graph to advertisers. vapurr pays you. Opt in, we keep host + HTTPS + time. No path, no query, no cookies, no keystrokes.</p>
    <div class="steel" style="margin-top:24px">
      <div class="row">
        <div>
          <b>Share browsing hosts</b>
          <div class="mono" id="opt-state">off</div>
        </div>
        <button class="switch" id="opt" type="button" aria-label="opt in"><span class="knob"></span></button>
      </div>
    </div>
    <div class="amt" id="pending">$0.000</div>
    <div class="mono" id="meta">0 visits queued · $0.001 / visit · USDG</div>
    <button class="btn" id="submit" type="button" style="margin-top:16px">Submit window</button>
    <p class="hosts" id="hosts"></p>
    <div class="list" id="receipts"></div>
  </div>
  <script src="/ipc.js"></script>
  <script>
    function paint(s) {
      if (!s) return;
      var on = !!s.opt_in;
      document.getElementById("opt").classList.toggle("on", on);
      document.getElementById("opt-state").textContent = on ? "on" : "off";
      document.getElementById("pending").textContent = "$" + (s.pending_usdg || "0.000");
      document.getElementById("meta").textContent = (s.pending_visits || 0) + " visits queued · " + (s.rate || "") + " · USDG on Robinhood Chain";
      var hosts = s.hosts_unsubmitted || [];
      document.getElementById("hosts").textContent = hosts.length ? ("This window: " + hosts.slice(0, 24).join(" · ")) : "No unsubmitted hosts. Browse with sharing on.";
      var box = document.getElementById("receipts");
      box.innerHTML = "";
      (s.receipts || []).forEach(function (r) {
        var el = document.createElement("div");
        el.className = "steel item";
        el.innerHTML = "<div class='row'><b>Receipt " + r.id + "</b><span>" + r.status + "</span></div><span>" + r.visits + " visits · " + r.hosts + " hosts · $" + (r.usdg_minor / 1000000).toFixed(3) + "</span>";
        box.appendChild(el);
      });
    }
    window.__setDesk = paint;
    document.getElementById("opt").onclick = function () { vapurr.send({ cmd: "earn-toggle" }); };
    document.getElementById("submit").onclick = function () { vapurr.send({ cmd: "earn-submit" }); };
    vapurr.send({ cmd: "desk" });
  </script>
</body>
</html>
