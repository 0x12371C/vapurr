<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Scan — vapurr</title>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <style>
    body { overflow: auto; user-select: text; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px 88px; }
    .top {
      position: sticky; top: 0; z-index: 8;
      background: var(--color-void);
      padding: 14px 0 12px;
      border-bottom: 1px solid var(--color-forest);
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--color-muted); flex-shrink: 0; }
    .brand .pip.on { background: var(--color-lime); box-shadow: 0 0 0 3px rgba(192,248,0,0.16); }
    .kicker { color: var(--color-lime); }
    .live { color: var(--color-muted); font-size: 12px; margin-top: 2px; }
    h1 { font-size: 28px; font-weight: 600; margin: 4px 0 8px; letter-spacing: 0.02em; }
    .hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 0 16px; }
    .hero .value { font-size: 28px; font-weight: 600; color: var(--color-snow); }
    .search { display: flex; gap: 8px; width: min(560px, 100%); position: relative; }
    .search .fieldwrap { flex: 1; position: relative; min-width: 0; }
    .search .field { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    .search .btn { height: 44px; }
    .suggest {
      display: none; position: absolute; left: 0; right: 0; top: 48px;
      background: var(--color-steel); border: 1px solid var(--color-lime); border-radius: 10px;
      z-index: 9; overflow: hidden;
    }
    .suggest.on { display: block; }
    .suggest button {
      display: block; width: 100%; text-align: left; height: auto; padding: 10px 12px;
      border: 0; border-bottom: 1px solid var(--color-forest); background: transparent;
      color: var(--color-snow); font-size: 12px; border-radius: 0;
    }
    .suggest button:last-child { border-bottom: 0; }
    .suggest button:hover { background: var(--color-forest); }
    .suggest button.on { background: var(--color-forest); color: var(--color-lime); }
    .tabs { display: flex; gap: 6px; margin: 14px 0 16px; flex-wrap: wrap; }
    .tabs button {
      height: 32px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--color-forest); background: transparent; color: var(--color-muted);
      font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .tabs button.on { border-color: var(--color-lime); color: var(--color-lime); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 16px; }
    .stat { background: var(--color-steel); border: 1px solid var(--color-forest); border-radius: 12px; padding: 12px 14px; min-height: 74px; }
    .stat b { display: block; font-size: 18px; font-weight: 600; margin-top: 6px; word-break: break-word; }
    .spark { display: flex; align-items: flex-end; gap: 3px; height: 44px; margin: 0 0 16px; }
    .spark i { flex: 1; min-width: 6px; background: var(--color-forest); border-radius: 2px 2px 0 0; display: block; }
    .spark i.on { background: var(--color-lime); }
    .meter-wrap { display: grid; grid-template-columns: 168px 1fr; gap: 18px; align-items: center; margin: 0 0 16px; background: var(--color-steel); border: 1px solid var(--color-forest); border-radius: 12px; padding: 14px 16px; }
    .meter { width: 156px; height: 156px; }
    .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .lane { background: var(--color-void); border: 1px solid var(--color-forest); border-radius: 12px; padding: 12px 14px; }
    .lane.on { border-color: var(--color-lime); }
    .lane b { display: block; font-size: 20px; margin: 6px 0 2px; }
    .cols { display: grid; grid-template-columns: 1fr 1.35fr; gap: 12px; }
    .cols.stack { grid-template-columns: 1fr; }
    .col { background: var(--color-steel); border: 1px solid var(--color-forest); border-radius: 12px; padding: 16px; min-height: 220px; overflow: auto; }
    .col h2, .sheet h2, .details > h2 {
      font-size: 13px; letter-spacing: 0.02em; text-transform: none; color: var(--color-snow);
      margin: 12px 0 4px; font-weight: 600;
    }
    .sheet { margin: 0 0 14px; min-height: 0; }
    .details {
      background: var(--color-steel); border: 1px solid var(--color-forest); border-radius: 12px;
      padding: 4px 20px 12px; margin: 0 0 16px;
    }
    .details > h2 { padding-bottom: 10px; border-bottom: 1px solid var(--color-forest); margin-bottom: 0; }
    .kv.wide { grid-template-columns: 200px 1fr; }
    .kv.wide span, .kv.wide b { padding: 12px 8px 12px 0; }
    .kv .subhead {
      grid-column: 1 / -1; color: var(--color-lime); font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 16px 0 8px; border-bottom: 1px solid var(--color-forest);
    }
    .action-line {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
      padding: 10px 0; border-bottom: 1px solid var(--color-forest);
      font-size: 13px; color: var(--color-snow); line-height: 1.45;
    }
    .action-line:last-child { border-bottom: 0; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.grid th {
      text-align: left; color: var(--color-muted); font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; font-weight: 600; padding: 8px 8px 10px; border-bottom: 1px solid var(--color-forest);
    }
    table.grid td { padding: 7px 8px; border-bottom: 1px solid var(--color-forest); vertical-align: middle; }
    table.grid tr:last-child td { border-bottom: 0; }
    table.grid tbody tr { cursor: pointer; }
    table.grid tbody tr:hover td { color: var(--color-snow); background: var(--color-forest); }
    table.grid tbody tr:focus,
    table.grid tbody tr:focus-within { outline: 1px solid var(--color-lime); background: var(--color-forest); }
    .hashwrap { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
    .hash { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--color-lime); background: transparent; border: 0; padding: 0; height: auto; }
    .hash.full { font-size: 12px; word-break: break-all; text-align: left; }
    .copy {
      border: 0; background: transparent; color: var(--color-lime); font-size: 11px;
      padding: 0; height: auto; letter-spacing: 0.04em; opacity: 1; flex-shrink: 0;
    }
    .copy:hover, .copy:focus { color: var(--color-snow); opacity: 1; }
    .ident {
      display: inline-grid; grid-template-columns: repeat(5, 3px); grid-template-rows: repeat(5, 3px);
      gap: 1px; width: 19px; height: 19px; flex-shrink: 0;
    }
    .ident i { background: var(--color-forest); display: block; border-radius: 0.5px; }
    .ident i.on { background: var(--color-lime); }
    .addrchip { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .addrchip .tag { color: var(--color-lime); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
    .addrchip .tag + .hashwrap .hash { color: var(--color-muted); font-size: 11px; }
    .flow {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center;
      background: var(--color-steel); border: 1px solid var(--color-forest); border-radius: 12px;
      padding: 16px; margin: 0 0 14px;
    }
    .flow-end { min-width: 0; }
    .flow-mid { text-align: center; color: var(--color-lime); font-size: 22px; line-height: 1; padding: 0 8px; }
    .flow-mid .mono { color: var(--color-muted); font-size: 11px; margin-bottom: 6px; }
    .meta { color: var(--color-muted); font-size: 12px; }
    .crumb { display: flex; gap: 8px; align-items: center; margin: 4px 0 12px; flex-wrap: wrap; }
    .kv { display: grid; grid-template-columns: 168px 1fr; gap: 0; margin: 0; font-size: 13px; }
    .kv span, .kv b {
      padding: 10px 0; border-bottom: 1px solid var(--color-forest); min-width: 0;
    }
    .kv span { color: var(--color-muted); letter-spacing: 0.02em; }
    .kv b { font-weight: 400; word-break: break-all; color: var(--color-snow); }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--color-forest); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .pill.on { border-color: var(--color-lime); color: var(--color-lime); }
    .pill.bad { border-color: var(--color-muted); color: var(--color-muted); }
    .log { border-top: 1px solid var(--color-forest); padding: 12px 0; }
    .log:first-of-type { border-top: 0; }
    .log .loghead { color: var(--color-lime); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
    .liq-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
    .liq-head h1 { margin: 0; }
    .liq-stage {
      position: relative; height: 580px; width: 100%;
      background: radial-gradient(ellipse 70% 55% at 48% 46%, color-mix(in srgb, var(--color-lime) 10%, transparent) 0%, transparent 62%), var(--color-void);
      border: 1px solid var(--color-forest); border-radius: 12px; margin: 0 0 16px; overflow: hidden;
    }
    .liq-stage.warm { animation: skel-pulse 1.4s ease-in-out infinite; }
    #liq-graph { height: 100%; width: 100%; min-height: 520px; margin: 0; border: 0; border-radius: 0; background: transparent; }
    #liq-graph svg { width: 100%; height: 100%; display: block; }
    #liq-graph .liq-n text, #liq-graph .liq-n .liq-aura { pointer-events: none; }
    #liq-graph .liq-n.is-dim, #liq-graph .liq-e.is-dim { opacity: 0.14; }
    .liq-overlay {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 8px; pointer-events: none; z-index: 2;
    }
    .liq-overlay > * { pointer-events: auto; }
    .liq-legend { display: flex; gap: 8px; flex-wrap: wrap; }
    .liq-legend span {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--color-muted); background: color-mix(in srgb, var(--color-void) 78%, transparent);
      border: 1px solid var(--color-forest); border-radius: 999px; padding: 4px 10px;
    }
    .liq-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .liq-legend i.hub { background: var(--color-lime); box-shadow: 0 0 8px rgba(192,248,0,0.35); }
    .liq-legend i.token { background: var(--color-muted); }
    .liq-legend i.edge { background: var(--color-lime); opacity: 0.35; }
    .liq-tools { display: flex; gap: 6px; }
    .liq-card {
      position: absolute; left: 12px; bottom: 12px; max-width: min(420px, calc(100% - 24px));
      background: color-mix(in srgb, var(--color-steel) 92%, transparent);
      border: 1px solid var(--color-lime); border-radius: 10px; padding: 10px 12px; z-index: 2;
      display: none;
    }
    .liq-card.on { display: block; }
    .liq-card .sym { color: var(--color-lime); font-size: 15px; font-weight: 600; }
    .liq-card .row { color: var(--color-muted); font-size: 12px; margin-top: 4px; }
    .liq-filter { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; align-items: center; }
    .liq-filter .field { height: 34px; font-size: 13px; width: min(280px, 100%); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
    .chips button {
      height: 28px; padding: 0 10px; border-radius: 999px;
      border: 1px solid var(--color-forest); background: transparent;
      color: var(--color-muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .chips button.on { border-color: var(--color-lime); color: var(--color-lime); }
    .liq-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
    .liq-live {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--color-lime); font-size: 12px; letter-spacing: 0.06em;
    }
    .liq-live .pip {
      width: 8px; height: 8px; border-radius: 50%; background: var(--color-lime);
      box-shadow: 0 0 0 0 rgba(192,248,0,0.55);
      animation: liq-pip 1.6s ease-out infinite;
    }
    @keyframes liq-pip {
      0% { box-shadow: 0 0 0 0 rgba(192,248,0,0.5); }
      70% { box-shadow: 0 0 0 8px rgba(192,248,0,0); }
      100% { box-shadow: 0 0 0 0 rgba(192,248,0,0); }
    }
    .liq-shares { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
    .liq-share { display: grid; grid-template-columns: 88px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; }
    .liq-share span { color: var(--color-muted); }
    .liq-share b { text-align: right; font-weight: 600; }
    .liq-share .bar { height: 8px; background: var(--color-forest); border-radius: 8px; overflow: hidden; }
    .liq-share .bar i { display: block; height: 100%; background: var(--color-lime); width: 0; transition: width 0.4s ease; }
    .flow-split { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 0 0 16px; }
    .flow-split .bar { height: 10px; border-radius: 8px; overflow: hidden; display: flex; background: var(--color-forest); }
    .flow-split .bar i.buy { background: var(--color-lime); }
    .flow-split .bar i.sell { background: #5a4030; }
    .flow-split .buy { color: var(--color-lime); font-size: 12px; }
    .flow-split .sell { color: var(--color-muted); font-size: 12px; text-align: right; }
    .stat.flash b { animation: liq-flash 0.7s ease; }
    @keyframes liq-flash {
      0% { color: var(--color-lime); }
      100% { color: var(--color-snow); }
    }
    #liq-graph .liq-n.hub .liq-core {
      animation: liq-breathe 2.4s ease-in-out infinite;
    }
    @keyframes liq-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }
    .chg.up { color: var(--color-lime); }
    .chg.dn { color: var(--color-muted); }
    .stat.go { cursor: pointer; }
    .stat.go:hover { border-color: var(--color-lime); }
    .empty { color: var(--color-muted); font-size: 13px; padding: 28px 0; line-height: 1.5; }
    .hex {
      font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--color-muted);
      background: var(--color-void); border: 1px solid var(--color-forest); border-radius: 8px;
      padding: 12px; overflow: auto; max-height: 220px; white-space: pre-wrap; word-break: break-all;
      user-select: text; margin: 8px 0 0;
    }
    .pager { display: flex; gap: 8px; margin: 12px 0 18px; flex-wrap: wrap; align-items: center; }
    .pager .btn-ghost { border-color: var(--color-lime); color: var(--color-lime); }
    .btn-ghost:disabled { opacity: 0.38; pointer-events: none; }
    .skel { height: 14px; border-radius: 6px; width: 40%; margin: 10px 0; background: var(--color-forest); animation: skel-pulse 1.1s ease-in-out infinite; }
    .stat .skel { width: 72%; height: 18px; margin: 10px 0 0; }
    #view[aria-busy="true"] { min-height: 280px; }
    @keyframes skel-pulse {
      0%, 100% { background: var(--color-forest); }
      50% { background: #3d5200; box-shadow: inset 0 0 0 1px rgba(192,248,0,0.22); }
    }
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
      background: var(--color-lime); color: var(--color-void); padding: 8px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.06em; opacity: 0; pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .cols, .flow, .meter-wrap, .liq-cols { grid-template-columns: 1fr; }
      .flow-mid { padding: 8px 0; }
      table.grid { font-size: 12px; }
      .kv { grid-template-columns: 120px 1fr; }
      .liq-stage { height: 420px; }
    }
    @media (max-width: 560px) {
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="pip" id="livepip"></span>
        <div>
          <div class="mono kicker">SCAN · ROBINHOOD CHAIN · 4663</div>
          <div class="live" id="live">connecting…</div>
        </div>
      </div>
      <form class="search" id="go">
        <div class="fieldwrap">
          <input class="field" id="q" placeholder="Block, tx, address, token  ·  press /" spellcheck="false" autocomplete="off"/>
          <div class="suggest" id="suggest" hidden></div>
        </div>
        <button class="btn" type="submit">Search</button>
      </form>
    </header>
    <div class="tabs" id="tabs" role="tablist">
      <button type="button" data-tab="head" class="on" role="tab" aria-selected="true" tabindex="0">Overview</button>
      <button type="button" data-tab="blocks" role="tab" aria-selected="false" tabindex="-1">Blocks</button>
      <button type="button" data-tab="txs" role="tab" aria-selected="false" tabindex="-1">Transactions</button>
      <button type="button" data-tab="tokens" role="tab" aria-selected="false" tabindex="-1">Tokens</button>
      <button type="button" data-tab="gas" role="tab" aria-selected="false" tabindex="-1">Gas</button>
      <button type="button" data-tab="liq" role="tab" aria-selected="false" tabindex="-1">Liquidity</button>
    </div>
    <div id="view"><div class="empty">Loading head…</div></div>
  </div>
  <div id="toast" role="status"></div>
  <script src="/ipc.js"></script>
  <script src="/explorer.js"></script>
</body>
</html>
