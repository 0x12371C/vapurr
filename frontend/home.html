<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>VAPURR</title>
  <link rel="preload" href="/fonts/Sora-SemiBold.ttf" as="font" type="font/ttf" crossorigin/>
  <link rel="preload" href="/logo.png" as="image" fetchpriority="high"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>

  <style>
    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .shader-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .shader-layer canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 0;
    }
    .floor-head { align-items: center; }
    .floor-head .btn-ghost { height: 28px; font-size: 12px; flex-shrink: 0; white-space: nowrap; }
    .floor-note { display: none; }
    .floor-grid { flex-wrap: nowrap; }
    .dock {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px 24px 10px;
      border-top: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        color-mix(in srgb, var(--color-void) 12%, transparent) 36%,
        color-mix(in srgb, var(--color-void) 72%, transparent) 100%
      );
      position: relative;
      z-index: 1;
      overflow: visible;
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: min(420px, 72vw);
      height: auto;
      max-height: 112px;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      display: block;
    }
    .tag {
      color: var(--color-muted);
      letter-spacing: 0.02em;
      font-size: 15px;
      font-weight: 400;
      margin: 0;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 0;
      width: min(480px, 88%);
      background: var(--color-steel);
      border: 1px solid var(--color-forest);
      border-radius: 12px;
      overflow: hidden;
    }
    .search:focus-within { border-color: var(--color-lime); }
    .search input {
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 0;
    }
    .search input:focus { outline: none; }
    .search .go {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      border-radius: 0;
    }
    .search .go:hover { filter: none; background: transparent; }
    .search .go svg { width: 18px; height: 18px; stroke: var(--color-muted); fill: none; stroke-width: 2.2; }
    .search:focus-within .go svg { stroke: var(--color-lime); }
    .tiles { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; overflow: visible; }
    .foot {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 8px;
      position: relative;
      z-index: 2;
    }
    .powered { display: flex; align-items: center; }
    .powered .rhc-logo { height: 22px; width: auto; display: block; }
    .powered .rhc-logo-light { display: none; }
    html[data-theme="light"] .powered .rhc-logo-dark { display: none; }
    html[data-theme="light"] .powered .rhc-logo-light { display: block; }
    .connected { display: flex; align-items: center; gap: 8px; color: var(--color-muted); font-size: 12px; }
    .connected.off .pip { background: var(--color-muted); box-shadow: none; }
  </style>
</head>
<body>
  <div class="shader-layer" aria-hidden="true"><canvas id="shader"></canvas></div>
  <div class="stage" id="floor">
    <div class="floor-head">
      <span class="mono">FLOOR</span>
      <span class="floor-note"></span>
      <button class="btn-ghost" id="floor-sell" type="button">List yours</button>
    </div>
    <div class="floor-grid" id="floor-grid"></div>
  </div>
  <div class="dock">
    <div class="brand">
      <img class="logo" src="/logo.png" alt="VAPURR" decoding="async" fetchpriority="high"/>
      <p class="tag">Browse Comfy.</p>
    </div>
    <form class="search" id="go">
      <input class="field" id="q" autofocus placeholder="A site, alice.hood, 0x, or wallet"/>
      <button class="btn go" type="submit" title="Go" aria-label="Go">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="tiles">
      <button class="tile" data-pane="wallet">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><rect x="14" y="10" width="5" height="4" rx="1"/></svg>
        Wallet
      </button>
      <button class="tile" data-pane="swap">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 8h14M15 5l4 3-4 3M19 16H5M9 13l-4 3 4 3"/></svg>
        Swap
      </button>
      <button class="tile" data-pane="stake">
        <svg class="ico" viewBox="0 0 24 24"><rect x="7" y="11" width="10" height="8" rx="1.5"/><path d="M9 11V8a3 3 0 016 0v3"/></svg>
        Stake
      </button>
      <button class="tile" data-pane="bridge">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 16a7 7 0 0114 0"/><path d="M8 16v3M16 16v3"/><path d="M5 16h2M17 16h2"/></svg>
        Bridge
      </button>
      <button class="tile" data-pane="pusd">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 4v16M8 8h6.5a2.5 2.5 0 010 5H8h7a2.5 2.5 0 010 5H8"/></svg>
        $PUSD
      </button>
      <button class="tile" data-pane="vapurrbid">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 18h4v-6H4zM10 18h4V6h-4zM16 18h4v-4h-4z"/><path d="M12 3v3"/></svg>
        vapurrbid
      </button>
      <button class="tile" data-pane="pns">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M15.2 10.2v2.6a2 2 0 101.4 1.9"/></svg>
        PNS
      </button>
      <button class="tile" data-go="https://fomo.family" title="Live Trenches">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 16l4-6 4 3 4-8 4 11"/></svg>
        Live Trenches
      </button>
      <button class="tile" data-pane="scan">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>
        Scan
      </button>
      <button class="tile" data-pane="ketbook">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 5h10a2 2 0 012 2v12H7a2 2 0 01-2-2V5z"/><path d="M7 19h12M9 8h6"/></svg>
        Ketbook
      </button>
      <button class="tile" data-pane="dapps">
        <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
        dApps
      </button>
    </div>
  </div>
  <div class="foot">
    <div class="powered">
      <img class="rhc-logo rhc-logo-dark" src="/robinhood-chain-logo-white.svg" alt="Robinhood Chain"/>
      <img class="rhc-logo rhc-logo-light" src="/robinhood-chain-logo-black.svg" alt="Robinhood Chain"/>
    </div>
    <div class="connected off" id="live"><span class="pip"></span> <span id="live-label">rpc…</span></div>
  </div>
  <script src="/ipc.js"></script>
  <script src="/shader.js"></script>
  <script src="/floor.js"></script>
  <script>
    startShader(document.getElementById("shader"));
    paintFloor(document.getElementById("floor-grid"));
    document.getElementById("floor-sell").onclick = function () { openFloorSell(); };
    window.__setChain = function (snap) {
      var el = document.getElementById("live");
      var lab = document.getElementById("live-label");
      if (!el || !lab || !snap) return;
      if (snap.ok && snap.block) {
        el.classList.remove("off");
        lab.textContent = "Live";
      } else {
        el.classList.add("off");
        lab.textContent = "Waiting";
      }
    };
    document.getElementById("go").addEventListener("submit", function (e) {
      e.preventDefault();
      vapurr.go(document.getElementById("q").value);
    });
    document.querySelectorAll(".tile").forEach(function (el) {
      el.addEventListener("click", function () {
        var go = el.getAttribute("data-go");
        if (go) {
          vapurr.go(go);
          return;
        }
        vapurr.send({ cmd: "pane", id: el.getAttribute("data-pane") });
      });
    });
    window.__setOutbid = function (s) {
      paintFloor(document.getElementById("floor-grid"), s && s.listings);
    };
    vapurr.send({ cmd: "desk" });
    vapurr.send({ cmd: "outbid" });
  </script>
</body>
</html>
