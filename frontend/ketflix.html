<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Ketflix</title>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <style>
    html, body {
      overflow: auto;
      height: auto;
      min-height: 100%;
      background: #0b0b0b;
      color: #fff;
    }
    .nav {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 22px;
      padding: 14px 40px;
      background: linear-gradient(180deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 70%, transparent);
      transition: background .2s ease;
    }
    .nav.solid { background: rgba(11,11,11,.96); backdrop-filter: blur(8px); }
    .nav .logo { height: 28px; display: block; }
    .nav a {
      color: #b3b3b3; font-size: 13px; font-weight: 500;
      text-decoration: none;
    }
    .nav a:hover { color: #e5e5e5; text-decoration: none; }
    .nav a.on { color: #fff; font-weight: 600; }
    .nav .grow { flex: 1; }
    .nav .sub {
      color: #6a6a6a;
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .hero {
      position: relative;
      min-height: min(74vh, 720px);
      margin-top: -58px;
      overflow: hidden;
    }
    .hero .bg {
      position: absolute; inset: -2%;
      background: #111 center center / cover no-repeat;
      filter: saturate(1.08) contrast(1.04) brightness(0.78);
    }
    .hero .shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, #0b0b0b 8%, rgba(11,11,11,.82) 34%, rgba(11,11,11,.25) 58%, transparent 78%),
        linear-gradient(0deg, #0b0b0b 0%, rgba(11,11,11,.55) 18%, transparent 42%),
        linear-gradient(180deg, rgba(11,11,11,.55) 0%, transparent 22%);
    }
    .hero .tv {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: none; z-index: 1; background: #000;
    }
    .hero .tv.on { display: block; }
    .hero .meta {
      position: relative; z-index: 2;
      padding: 140px 48px 88px;
      max-width: 520px;
    }
    .hero .badge {
      display: inline-flex; align-items: center; gap: 8px;
      color: #e50914; font-size: 12px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .hero .badge::before {
      content: ""; width: 18px; height: 18px;
      background: #e50914;
      mask: url("/ketflix-logo.svg") center / contain no-repeat;
      -webkit-mask: url("/ketflix-logo.svg") center / contain no-repeat;
      display: none;
    }
    .hero h1 {
      font-size: clamp(36px, 5.2vw, 64px);
      font-weight: 700; letter-spacing: -0.035em;
      line-height: 0.98; margin: 0 0 14px;
      text-shadow: 0 2px 24px rgba(0,0,0,.55);
    }
    .hero .facts {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      color: #d2d2d2; font-size: 14px; margin-bottom: 14px;
    }
    .hero .facts .k {
      border: 1px solid #8a8a8a; border-radius: 2px;
      padding: 0 6px; font-size: 11px; line-height: 18px; color: #c8c8c8;
    }
    .hero .facts .dot::before { content: "·"; margin: 0 2px; color: #8a8a8a; }
    .hero p {
      color: #d0d0d0; line-height: 1.55; margin: 0 0 22px;
      max-width: 420px; font-size: 15px;
      text-shadow: 0 1px 12px rgba(0,0,0,.45);
    }
    .hero .acts { display: flex; gap: 12px; flex-wrap: wrap; }
    .kplay, .kmore {
      height: 44px; padding: 0 26px; border: 0; border-radius: 4px;
      font-weight: 700; font-size: 15px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .kplay { background: #fff; color: #141414; }
    .kplay:hover { background: #e6e6e6; }
    .kplay .tri {
      width: 0; height: 0;
      border-style: solid;
      border-width: 7px 0 7px 12px;
      border-color: transparent transparent transparent #141414;
    }
    .kmore { background: rgba(109,109,110,.7); color: #fff; backdrop-filter: blur(4px); }
    .kmore:hover { background: rgba(109,109,110,.9); }
    .lane {
      position: relative;
      margin-top: -48px;
      padding-bottom: 4px;
      z-index: 3;
    }
    .lane + .lane { margin-top: 4px; }
    .lane-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 10px 40px 6px;
    }
    .lane-head .lab {
      font-weight: 600; font-size: 1.2rem; color: #e5e5e5;
      letter-spacing: -0.01em;
    }
    .lane-head .nub { color: #6a6a6a; font-size: 12px; }
    .row-wrap { position: relative; }
    .row {
      display: flex; gap: 10px; padding: 6px 40px 28px;
      overflow-x: auto; scroll-snap-type: x proximity;
      scrollbar-width: none;
    }
    .row::-webkit-scrollbar { display: none; }
    .nudge {
      position: absolute; top: 6px; bottom: 28px; width: 42px;
      border: 0; color: #fff; font-size: 28px; line-height: 1;
      z-index: 4; cursor: pointer; opacity: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.72), transparent);
      transition: opacity .15s ease;
    }
    .row-wrap:hover .nudge { opacity: 1; }
    .nudge.r {
      right: 0;
      background: linear-gradient(270deg, rgba(0,0,0,.72), transparent);
    }
    .nudge.l { left: 0; }
    .nudge:hover { color: #fff; }
    .card {
      flex: 0 0 280px; cursor: pointer; border: 0; padding: 0;
      background: transparent; text-align: left;
      scroll-snap-align: start;
      transition: transform .18s ease, filter .18s ease;
      transform-origin: center center;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-6px) scale(1.05);
      z-index: 2; filter: brightness(1.06);
    }
    .card .shot {
      position: relative;
      width: 280px; height: 158px;
      border-radius: 6px; overflow: hidden;
      background: #161616;
      box-shadow: 0 10px 28px rgba(0,0,0,.55);
    }
    .card .shot img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 20%;
      display: block;
    }
    .card .shot::after {
      content: ""; position: absolute; inset: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      border-radius: 6px; pointer-events: none;
    }
    .card.on .shot { outline: 2px solid var(--color-lime, #c0f800); outline-offset: 2px; }
    .card .t {
      color: #b3b3b3; font-size: 12px; margin-top: 8px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 2px;
    }
    .card:hover .t { color: #e5e5e5; }
    .foot {
      padding: 20px 40px 56px;
      color: #555; font-size: 12px; letter-spacing: 0.04em;
    }
    .sheet {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0,0,0,.78);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    .sheet.on { display: flex; }
    .sheet .box {
      display: grid; grid-template-columns: 280px 1fr; gap: 22px;
      max-width: 720px; width: 100%;
      background: #141414; border-radius: 10px; padding: 18px;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }
    .sheet .shot {
      width: 280px; height: 158px; border-radius: 6px; overflow: hidden;
      background: #111;
    }
    .sheet .shot img {
      width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
      display: block;
    }
    .sheet h2 { font-size: 28px; letter-spacing: -0.03em; margin: 0 0 8px; }
    .sheet .badge {
      color: #e50914; font-size: 11px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px;
    }
    .sheet p { color: #b3b3b3; line-height: 1.5; margin: 0 0 18px; font-size: 14px; }
    @media (max-width: 820px) {
      .hero .meta { padding: 110px 24px 72px; }
      .nav { padding: 12px 18px; gap: 12px; }
      .lane-head, .row { padding-left: 18px; padding-right: 18px; }
      .card, .card .shot { width: 220px; }
      .card .shot { height: 124px; }
      .sheet .box { grid-template-columns: 1fr; }
      .sheet .shot { width: 100%; height: 160px; }
    }
  </style>
</head>
<body id="top">
  <div class="nav" id="nav">
    <img class="logo" src="/ketflix-logo.svg" alt="Ketflix"/>
    <a href="#top" class="on" id="nav-home">Home</a>
    <a href="#originals" id="nav-orig">Originals</a>
    <a href="#trending">Trending</a>
    <span class="grow"></span>
    <span class="sub">infinite slop · $VAPURR</span>
  </div>
  <div class="hero" id="hero">
    <div class="bg" id="hbg"></div>
    <div class="shade"></div>
    <video class="tv" id="tv" playsinline muted></video>
    <div class="meta">
      <div class="badge" id="badge">Ketflix Original</div>
      <h1 id="ht">THE KETRIX</h1>
      <div class="facts" id="facts"></div>
      <p id="hg">There is no spoon.</p>
      <div class="acts">
        <button class="kplay" type="button" id="play"><span class="tri" aria-hidden="true"></span>Play</button>
        <button class="kmore" type="button" id="more">More Info</button>
      </div>
    </div>
  </div>
  <div id="lanes"></div>
  <div class="foot">Ketflix · vapurr chrome · trailers when ready</div>
  <div class="sheet" id="sheet" hidden>
    <div class="box">
      <div class="shot"><img id="st-img" alt=""/></div>
      <div>
        <div class="badge" id="st-badge">Ketflix Original</div>
        <h2 id="st-t"></h2>
        <p id="st-g"></p>
        <div class="acts">
          <button class="kplay" type="button" id="st-play"><span class="tri" aria-hidden="true"></span>Play</button>
          <button class="kmore" type="button" id="st-x">Close</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/ipc.js"></script>
  <script>
    var FALLBACK = {
      hero: "the-ketrix",
      rows: [
        { id: "originals", label: "Ketflix Originals", slugs: [
          "the-ketrix","ketbreaking-bad","the-lion-of-ketdah","pirates-of-ketibbean",
          "keterman","home-alone-ketsters","the-ketfather","attack-on-ket",
          "back-to-the-keture","the-lord-of-the-ket","joket","john-wick-ketribution"
        ]},
        { id: "trending", label: "Trending on Ket", slugs: [
          "the-ketrix","ketbreaking-bad","joket","john-wick-ketribution","the-ketfather","attack-on-ket"
        ]}
      ],
      titles: [
        { slug:"the-ketrix", title:"THE KETRIX", tag:"There is no spoon." },
        { slug:"ketbreaking-bad", title:"Ketbreaking Bad", tag:"I am the one who vapes." },
        { slug:"the-lion-of-ketdah", title:"THE LION OF KETDAH", tag:"Everything the light touches is ket." },
        { slug:"pirates-of-ketibbean", title:"PIRATES of the KETIBBEAN", tag:"The Curse of the Lost Slop." },
        { slug:"keterman", title:"KETERMAN", tag:"One small slop for man, one giant rip for ketkind." },
        { slug:"home-alone-ketsters", title:"HOME ALONe", tag:"A Family Ketsters." },
        { slug:"the-ketfather", title:"The Ketfather", tag:"An offer you can't refuse... unless it's mids." },
        { slug:"attack-on-ket", title:"Attack on Ket", tag:"Walls. Titans. Ket." },
        { slug:"back-to-the-keture", title:"BACK TO THE KETURE", tag:"1.21 gigs?!???" },
        { slug:"the-lord-of-the-ket", title:"THE LORD OF THE KET", tag:"One slop to rule them all." },
        { slug:"joket", title:"JOKET", tag:"We live in a slopciety." },
        { slug:"john-wick-ketribution", title:"JOHN WICK: KETRIBUTION", tag:"You stole his slop. Now he wants it back." }
      ]
    };
    var titles = [];
    var bySlug = {};
    var cur = "the-ketrix";
    function poster(s) { return "/ketflix/posters/" + s + ".png"; }
    function backdrop(s) { return "/ketflix/backdrops/" + s + ".png"; }
    function trailer(s) { return "/ketflix/trailers/" + s + ".mp4"; }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c];
      });
    }
    function stopTv() {
      var v = document.getElementById("tv");
      v.classList.remove("on");
      v.pause();
      v.removeAttribute("src");
      v.load();
    }
    function paint(slug) {
      var t = bySlug[slug] || titles[0];
      if (!t) return;
      cur = t.slug;
      stopTv();
      document.getElementById("ht").textContent = t.title;
      document.getElementById("hg").textContent = t.tag;
      document.getElementById("badge").textContent = t.badge || "Ketflix Original";
      document.getElementById("facts").innerHTML =
        "<span>" + esc(t.year || 2026) + "</span>" +
        "<span class='k'>" + esc(t.rating || "K") + "</span>" +
        "<span class='dot'>" + esc(t.kind || "Movie") + "</span>" +
        "<span class='dot'>" + esc(t.runtime || "10s") + "</span>";
      var bg = "url('" + backdrop(t.slug) + "'), url('" + poster(t.slug) + "')";
      document.getElementById("hbg").style.backgroundImage = bg;
      [].forEach.call(document.querySelectorAll(".card"), function (c) {
        c.classList.toggle("on", c.getAttribute("data-slug") === t.slug);
      });
    }
    function play() {
      var t = bySlug[cur];
      if (!t) return;
      var v = document.getElementById("tv");
      v.classList.add("on");
      v.src = trailer(t.slug);
      v.onerror = function () {
        stopTv();
        if (window.vapurr && vapurr.send) {
          vapurr.send({ cmd: "toast", text: "Trailer soon — " + t.slug });
        }
      };
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    }
    function openSheet() {
      var t = bySlug[cur];
      if (!t) return;
      document.getElementById("st-t").textContent = t.title;
      document.getElementById("st-g").textContent = t.tag;
      document.getElementById("st-badge").textContent = t.badge || "Ketflix Original";
      document.getElementById("st-img").src = poster(t.slug);
      document.getElementById("st-img").alt = t.title;
      var s = document.getElementById("sheet");
      s.hidden = false;
      s.classList.add("on");
    }
    function closeSheet() {
      var s = document.getElementById("sheet");
      s.classList.remove("on");
      s.hidden = true;
    }
    function card(t) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "card";
      b.setAttribute("data-slug", t.slug);
      b.innerHTML =
        "<div class='shot'><img src='" + poster(t.slug) + "' alt='" + esc(t.title) + "' loading='lazy'/></div>" +
        "<div class='t'>" + esc(t.title) + "</div>";
      b.querySelector("img").onerror = function () { this.style.opacity = "0.35"; };
      b.onclick = function () {
        paint(t.slug);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      return b;
    }
    function lane(row) {
      var wrap = document.createElement("section");
      wrap.className = "lane";
      wrap.id = row.id;
      wrap.innerHTML =
        "<div class='lane-head'><span class='lab'>" + esc(row.label) + "</span><span class='nub'>" + row.slugs.length + "</span></div>" +
        "<div class='row-wrap'>" +
        "<button class='nudge l' type='button' aria-label='Back'>‹</button>" +
        "<div class='row'></div>" +
        "<button class='nudge r' type='button' aria-label='More'>›</button>" +
        "</div>";
      var r = wrap.querySelector(".row");
      row.slugs.forEach(function (slug) {
        var t = bySlug[slug];
        if (t) r.appendChild(card(t));
      });
      wrap.querySelector(".nudge.l").onclick = function () { r.scrollBy({ left: -560, behavior: "smooth" }); };
      wrap.querySelector(".nudge.r").onclick = function () { r.scrollBy({ left: 560, behavior: "smooth" }); };
      return wrap;
    }
    function boot(cat) {
      titles = cat.titles || FALLBACK.titles;
      bySlug = {};
      titles.forEach(function (t) { bySlug[t.slug] = t; });
      var lanes = document.getElementById("lanes");
      lanes.innerHTML = "";
      (cat.rows || FALLBACK.rows).forEach(function (row) { lanes.appendChild(lane(row)); });
      paint(cat.hero || "the-ketrix");
    }
    document.getElementById("play").onclick = play;
    document.getElementById("more").onclick = openSheet;
    document.getElementById("st-play").onclick = function () { closeSheet(); play(); };
    document.getElementById("st-x").onclick = closeSheet;
    document.getElementById("sheet").onclick = function (e) {
      if (e.target.id === "sheet") closeSheet();
    };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeSheet();
    });
    window.addEventListener("scroll", function () {
      document.getElementById("nav").classList.toggle("solid", window.scrollY > 24);
    }, { passive: true });
    fetch("/ketflix/catalog.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(boot)
      .catch(function () { boot(FALLBACK); });
  </script>
</body>
</html>
