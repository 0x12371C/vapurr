<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Unlock</title>
  <link rel="preload" href="/mascot.png" as="image" fetchpriority="high"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      background: transparent;
      color: var(--color-snow);
      display: grid;
      place-items: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
      font-family: var(--font-sans, system-ui, -apple-system, Segoe UI, sans-serif);
    }

    /* Dimmed chrome behind the physical pad — not edge-to-edge lock UI */
    .dimmer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 38%, color-mix(in srgb, var(--color-forest) 32%, transparent), transparent 72%),
        color-mix(in srgb, var(--color-void) 74%, transparent);
    }

    /* Anodized titanium device shell — brushed metal chassis only */
    .device {
      --ti-hi: #b8bcc4;
      --ti-mid: #7a808a;
      --ti-lo: #3e444c;
      --ti-void: #1c2026;
      position: relative;
      z-index: 1;
      width: min(328px, calc(100vw - 36px));
      border-radius: 38px;
      padding: 14px 14px 16px;
      background:
        /* fine brush grain — metal shell only */
        repeating-linear-gradient(
          112deg,
          transparent 0 1.5px,
          color-mix(in srgb, var(--color-snow) 4.5%, transparent) 1.5px 2px,
          transparent 2px 3.5px,
          color-mix(in srgb, #000 5%, transparent) 3.5px 4px
        ),
        repeating-linear-gradient(
          22deg,
          transparent 0 6px,
          color-mix(in srgb, var(--color-snow) 2%, transparent) 6px 7px
        ),
        linear-gradient(158deg,
          var(--ti-hi) 0%,
          var(--ti-mid) 22%,
          var(--ti-lo) 48%,
          var(--ti-void) 78%,
          #12151a 100%);
      border: 1px solid color-mix(in srgb, var(--ti-hi) 42%, transparent);
      box-shadow:
        0 0 0 1px color-mix(in srgb, #000 55%, transparent),
        0 32px 72px color-mix(in srgb, #000 58%, transparent),
        0 8px 20px color-mix(in srgb, #000 35%, transparent),
        inset 0 1.5px 0 color-mix(in srgb, var(--color-snow) 38%, transparent),
        inset 0 -2px 0 color-mix(in srgb, #000 50%, transparent),
        inset 1.5px 0 0 color-mix(in srgb, var(--color-snow) 12%, transparent),
        inset -1.5px 0 0 color-mix(in srgb, #000 28%, transparent),
        inset 0 0 24px color-mix(in srgb, #000 18%, transparent);
      transform: translateY(0);
      animation: pad-in 0.42s cubic-bezier(0.22, 1.2, 0.36, 1) both;
      isolation: isolate;
    }
    .device::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 5;
      background:
        linear-gradient(115deg,
          color-mix(in srgb, var(--color-snow) 22%, transparent) 0%,
          transparent 18%,
          transparent 62%,
          color-mix(in srgb, #000 18%, transparent) 100%);
      mix-blend-mode: soft-light;
      opacity: 0.85;
    }
    @keyframes pad-in {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .device::before { content: none; display: none; }

    /* Top titanium bezel: earpiece slit + physical status LED jewel */
    .bezel-top {
      position: relative;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      height: 18px;
      margin: 2px 0 12px;
    }
    .earpiece {
      width: 92px;
      height: 7px;
      border-radius: 99px;
      background:
        linear-gradient(180deg,
          color-mix(in srgb, #000 55%, var(--ti-lo)) 0%,
          color-mix(in srgb, var(--ti-mid) 40%, #000) 100%);
      box-shadow:
        inset 0 1px 2px color-mix(in srgb, #000 60%, transparent),
        0 1px 0 color-mix(in srgb, var(--color-snow) 18%, transparent);
      flex-shrink: 0;
    }
    .status-led-well {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background:
        radial-gradient(circle at 50% 40%,
          color-mix(in srgb, var(--ti-lo) 70%, #000),
          var(--ti-void));
      box-shadow:
        inset 0 1.5px 3px color-mix(in srgb, #000 70%, transparent),
        inset 0 -1px 0 color-mix(in srgb, var(--color-snow) 10%, transparent),
        0 1px 0 color-mix(in srgb, var(--color-snow) 14%, transparent);
    }
    .status-led {
      --led: #ff2a32;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%,
          color-mix(in srgb, #fff 70%, var(--led)) 0%,
          var(--led) 46%,
          color-mix(in srgb, #000 40%, var(--led)) 100%);
      box-shadow:
        0 0 0 1px color-mix(in srgb, #000 45%, transparent),
        0 0 8px color-mix(in srgb, var(--led) 85%, transparent),
        0 0 18px color-mix(in srgb, var(--led) 55%, transparent),
        0 0 32px color-mix(in srgb, var(--led) 28%, transparent),
        inset 0 1px 1px color-mix(in srgb, #fff 45%, transparent);
      animation: led-pulse 1.55s ease-in-out infinite;
    }
    .status-led[data-state="ok"] {
      --led: #c0f800;
      animation: led-ok 1.1s ease-in-out infinite;
    }
    .status-led[data-state="fail"] {
      --led: #ff2a32;
      animation: led-fail 0.28s steps(2, end) infinite;
    }
    .status-led[data-state="entering"] {
      --led: #ff2a32;
      animation: led-pulse 0.9s ease-in-out infinite;
    }
    @keyframes led-pulse {
      0%, 100% { opacity: 0.62; filter: brightness(0.88); }
      50%      { opacity: 1;    filter: brightness(1.28); }
    }
    @keyframes led-ok {
      0%, 100% { opacity: 0.88; filter: brightness(1.05); }
      50%      { opacity: 1;    filter: brightness(1.35); }
    }
    @keyframes led-fail {
      0% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /*
      Liquid-glass display pane (iOS liquid glass / Vision Pro–ish).
      Truly transparent + refractive — NOT frosted, milky, etched, or grainy.
      Glyphs + lock chrome live INSIDE this pane; physical keys sit below on titanium.
    */
    .screen {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      padding: 18px 14px 14px;
      /* clear refractive slab — whisper of tint only, no frost wash */
      background:
        linear-gradient(165deg,
          color-mix(in srgb, var(--color-snow) 7%, transparent) 0%,
          color-mix(in srgb, #8ec8ff 3%, transparent) 34%,
          color-mix(in srgb, var(--color-snow) 1.5%, transparent) 62%,
          color-mix(in srgb, #c0f800 2%, transparent) 100%);
      border: 1px solid transparent;
      background-clip: padding-box;
      box-shadow:
        /* thin glass lip + edge refraction */
        inset 0 1px 0 color-mix(in srgb, var(--color-snow) 62%, transparent),
        inset 0 -1px 0 color-mix(in srgb, #000 22%, transparent),
        inset 1px 0 0 color-mix(in srgb, var(--color-snow) 22%, transparent),
        inset -1px 0 0 color-mix(in srgb, #7ec8ff 14%, transparent),
        inset 0 0 0 0.5px color-mix(in srgb, var(--color-snow) 28%, transparent),
        0 0 0 1px color-mix(in srgb, #000 45%, transparent),
        0 1px 0 color-mix(in srgb, var(--color-snow) 10%, transparent),
        0 10px 28px color-mix(in srgb, #000 28%, transparent);
      /* no backdrop blur — clear glass, not frosted */
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      isolation: isolate;
      margin-bottom: 12px;
    }

    /* SVG refractive rim — chromatic edge, lens feel */
    .glass-rim {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      border-radius: inherit;
      overflow: hidden;
    }
    .glass-rim svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Depth field for drifting cipher glyphs — inside the pane */
    .crypto-viz {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.9;
      border-radius: inherit;
    }

    /*
      Specular + refraction sheen only.
      Soft highlights, edge caustic, subtle RGB fringe — zero frost/grain/milk.
    */
    .glass-sheen {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      border-radius: inherit;
      background:
        /* primary specular catch (top-left) */
        radial-gradient(ellipse 90% 48% at 14% 4%,
          color-mix(in srgb, var(--color-snow) 42%, transparent),
          transparent 55%),
        /* secondary specular */
        radial-gradient(ellipse 48% 26% at 82% 14%,
          color-mix(in srgb, var(--color-snow) 14%, transparent),
          transparent 58%),
        /* soft lens caustic */
        radial-gradient(ellipse 70% 40% at 50% 110%,
          color-mix(in srgb, #7ec8ff 8%, transparent),
          transparent 60%),
        /* chromatic refraction band */
        linear-gradient(118deg,
          color-mix(in srgb, #ff8a80 6%, transparent) 0%,
          transparent 10%,
          color-mix(in srgb, var(--color-snow) 10%, transparent) 18%,
          transparent 36%,
          color-mix(in srgb, #7ec8ff 7%, transparent) 58%,
          transparent 72%,
          color-mix(in srgb, var(--color-lime) 5%, transparent) 88%,
          transparent 100%),
        /* bottom glass thickness cue — clear, not milky */
        linear-gradient(180deg,
          color-mix(in srgb, var(--color-snow) 6%, transparent) 0%,
          transparent 16%,
          transparent 84%,
          color-mix(in srgb, #000 8%, transparent) 100%);
      mix-blend-mode: screen;
      opacity: 0.72;
    }
    .glass-sheen::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      /* moving light kiss across the pane */
      background: linear-gradient(
        105deg,
        transparent 0%,
        transparent 38%,
        color-mix(in srgb, var(--color-snow) 18%, transparent) 49%,
        transparent 58%,
        transparent 100%
      );
      background-size: 220% 100%;
      animation: glass-sweep 7.5s ease-in-out infinite;
      opacity: 0.55;
      mix-blend-mode: soft-light;
    }
    .glass-sheen::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--color-snow) 28%, transparent),
        inset 0 2px 10px color-mix(in srgb, var(--color-snow) 14%, transparent),
        inset 0 -12px 26px color-mix(in srgb, #7ec8ff 8%, transparent),
        inset 1px 0 10px color-mix(in srgb, #ff8a80 5%, transparent),
        inset -1px 0 12px color-mix(in srgb, #7ec8ff 7%, transparent),
        inset 0 0 40px color-mix(in srgb, var(--color-snow) 3%, transparent);
    }
    @keyframes glass-sweep {
      0%, 100% { background-position: 120% 0; opacity: 0.35; }
      45% { background-position: -20% 0; opacity: 0.7; }
    }

    .screen > :not(.crypto-viz):not(.glass-sheen):not(.glass-rim) {
      position: relative;
      z-index: 2;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .mascot-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      /* mascot floats inside the glass with a soft refractive halo */
      filter: drop-shadow(0 0 12px color-mix(in srgb, var(--color-snow) 18%, transparent));
    }

    .mascot {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
      border-radius: 16px;
      background: #000;
      box-shadow:
        0 6px 18px color-mix(in srgb, #000 45%, transparent),
        0 0 0 1px color-mix(in srgb, var(--color-lime) 22%, transparent),
        inset 0 1px 0 color-mix(in srgb, var(--color-snow) 20%, transparent);
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .lock-badge {
      position: absolute;
      right: -6px;
      bottom: -4px;
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: color-mix(in srgb, var(--color-void) 72%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-lime) 45%, transparent);
      box-shadow:
        0 4px 10px color-mix(in srgb, #000 40%, transparent),
        inset 0 1px 0 color-mix(in srgb, var(--color-snow) 14%, transparent);
      display: grid;
      place-items: center;
      color: var(--color-lime);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .lock-badge svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .title-row .lock-inline {
      width: 16px;
      height: 16px;
      color: var(--color-lime);
      flex-shrink: 0;
      opacity: 0.95;
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--color-lime) 35%, transparent));
    }

    .mono.kicker {
      color: var(--color-lime);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2px;
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      text-shadow: 0 0 12px color-mix(in srgb, var(--color-lime) 28%, transparent);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.15;
      text-align: center;
      margin: 0;
      text-shadow: 0 1px 0 color-mix(in srgb, #000 35%, transparent);
    }

    .hint {
      color: var(--color-muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      min-height: 16px;
      margin: 6px 0 16px;
      max-width: 22em;
    }
    .hint.err { color: #ff8a80; }
    .hint.ok { color: var(--color-lime); }

    .dots {
      display: flex;
      gap: 14px;
      margin-bottom: 6px;
      padding: 4px;
    }
    .dots.shake {
      animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    .dots.ok-pulse .dot.on {
      animation: ok-pop 0.35s cubic-bezier(0.22, 1.4, 0.36, 1) both;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }
    @keyframes ok-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--color-lime) 55%, var(--color-muted));
      background: transparent;
      box-shadow:
        inset 0 1px 1px color-mix(in srgb, #000 30%, transparent),
        0 0 0 1px color-mix(in srgb, var(--color-snow) 8%, transparent);
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.16s cubic-bezier(0.22, 1.4, 0.36, 1), box-shadow 0.12s ease;
    }
    .dot.on {
      background: var(--color-lime);
      border-color: var(--color-lime);
      transform: scale(1.08);
      box-shadow:
        0 0 12px color-mix(in srgb, var(--color-lime) 48%, transparent),
        0 0 2px color-mix(in srgb, var(--color-snow) 40%, transparent);
    }
    .dot.bad {
      background: #ff8a80;
      border-color: #ff8a80;
      box-shadow: 0 0 10px color-mix(in srgb, #ff8a80 45%, transparent);
    }

    /* Physical keypad sits on the titanium body, around/below the glass pane */
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 68px);
      gap: 11px 14px;
      justify-content: center;
      user-select: none;
      margin-bottom: 2px;
      perspective: 600px;
      position: relative;
      z-index: 4;
    }

    /* Vercel-style physicalized keys: depth, soft shadow, spring press */
    .key {
      --key-face: color-mix(in srgb, var(--color-steel) 88%, #2a2e34);
      --key-depth: 5px;
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--color-snow);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform 0.18s cubic-bezier(0.22, 1.5, 0.36, 1);
    }
    .key::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: color-mix(in srgb, #000 55%, transparent);
      transform: translateY(var(--key-depth));
      filter: blur(0.2px);
      z-index: 0;
    }
    .key::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--color-snow) 10%, var(--key-face)) 0%,
          var(--key-face) 42%,
          color-mix(in srgb, var(--key-face) 78%, #000) 100%);
      box-shadow:
        inset 0 1px 0 color-mix(in srgb, var(--color-snow) 14%, transparent),
        inset 0 -1px 0 color-mix(in srgb, #000 35%, transparent),
        0 1px 0 color-mix(in srgb, var(--color-snow) 4%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-snow) 8%, transparent);
      z-index: 1;
      transition:
        transform 0.14s cubic-bezier(0.22, 1.5, 0.36, 1),
        background 0.12s ease,
        box-shadow 0.14s ease;
    }
    .key > span {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .key:hover::after {
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--color-forest) 55%, var(--key-face)) 0%,
          color-mix(in srgb, var(--color-steel) 70%, var(--color-forest)) 100%);
    }
    .key:focus-visible::after {
      box-shadow:
        inset 0 1px 0 color-mix(in srgb, var(--color-snow) 14%, transparent),
        0 0 0 2px color-mix(in srgb, var(--color-lime) 55%, transparent);
    }
    .key:active,
    .key.is-press {
      transform: translateY(2px);
    }
    .key:active::after,
    .key.is-press::after {
      transform: translateY(var(--key-depth));
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--color-lime) 28%, var(--key-face)) 0%,
          color-mix(in srgb, var(--color-steel) 75%, #000) 100%);
      box-shadow:
        inset 0 2px 6px color-mix(in srgb, #000 45%, transparent),
        inset 0 1px 0 color-mix(in srgb, var(--color-lime) 20%, transparent);
    }
    .key:active > span,
    .key.is-press > span {
      color: var(--color-lime);
      transform: scale(0.96);
    }

    .key.ghost {
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .key.ghost::before { opacity: 0; }
    .key.ghost::after {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }
    .key.ghost:hover { color: var(--color-snow); }
    .key.ghost:hover::after { background: color-mix(in srgb, var(--color-snow) 6%, transparent); }
    .key.ghost:active::after,
    .key.ghost.is-press::after {
      background: color-mix(in srgb, var(--color-lime) 12%, transparent);
      transform: translateY(2px);
      box-shadow: none;
    }
    .key.ghost:active,
    .key.ghost.is-press { transform: scale(0.96); }
    /* phone-pad spacer — keeps 0 centered */
    .key.ghost.spacer,
    .key.ghost.spacer:disabled {
      opacity: 0;
      pointer-events: none;
      cursor: default;
    }
    /* ket lime back-arrow delete */
    .key.ghost.del {
      color: var(--color-lime);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      opacity: 0.95;
    }
    .key.ghost.del > span {
      line-height: 1;
      transform: translateY(-1px);
    }
    .key.ghost.del:hover {
      color: color-mix(in srgb, var(--color-lime) 85%, var(--color-snow));
    }
    .key.ghost.del:hover::after {
      background: color-mix(in srgb, var(--color-lime) 10%, transparent);
    }
    .key.ghost.del:active,
    .key.ghost.del.is-press {
      color: var(--color-lime);
    }
    .key.ghost.del:active::after,
    .key.ghost.del.is-press::after {
      background: color-mix(in srgb, var(--color-lime) 18%, transparent);
    }
    .key:disabled { opacity: 0.35; pointer-events: none; }
    .key.ghost.spacer:disabled { opacity: 0; }

    .foot {
      margin-top: 12px;
      color: var(--color-muted);
      font-size: 10px;
      text-align: center;
      line-height: 1.4;
      max-width: 26em;
      opacity: 0.9;
      position: relative;
      z-index: 4;
    }
    .foot b { color: var(--color-snow); font-weight: 600; }

    html[data-theme="light"] .dimmer {
      background: color-mix(in srgb, var(--color-void) 55%, transparent);
    }
    html[data-theme="light"] .device {
      --ti-hi: #f2f3f5;
      --ti-mid: #c5c9d0;
      --ti-lo: #8e949e;
      --ti-void: #5c636e;
    }
    html[data-theme="light"] .screen {
      background:
        linear-gradient(165deg,
          color-mix(in srgb, #fff 18%, transparent) 0%,
          color-mix(in srgb, #8ec8ff 4%, transparent) 40%,
          color-mix(in srgb, #fff 6%, transparent) 100%);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    html[data-theme="light"] .crypto-viz { opacity: 0.5; }
    html[data-theme="light"] .glass-sheen {
      mix-blend-mode: soft-light;
      opacity: 0.55;
    }
    html[data-theme="light"] .key {
      --key-face: color-mix(in srgb, var(--color-steel) 98%, #fff);
      color: var(--color-void);
    }

    @media (prefers-reduced-motion: reduce) {
      .device { animation: none; }
      .crypto-viz { display: none; }
      .glass-sheen::before { animation: none; opacity: 0.4; }
      .status-led { animation: none; opacity: 1; filter: none; }
    }
  </style>
</head>
<body>
  <div class="dimmer" aria-hidden="true"></div>
  <div class="device" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <div class="bezel-top">
      <span class="earpiece" aria-hidden="true"></span>
      <span class="status-led-well" aria-hidden="true">
        <span class="status-led" id="status-led" data-state="locked" role="img" aria-label="Locked"></span>
      </span>
    </div>
    <div class="screen">
      <canvas class="crypto-viz" id="crypto-viz" aria-hidden="true"></canvas>
      <div class="glass-sheen" aria-hidden="true"></div>
      <div class="glass-rim" aria-hidden="true">
        <svg viewBox="0 0 300 360" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="rimSpec" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
              <stop offset="22%" stop-color="#8ec8ff" stop-opacity="0.22"/>
              <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
              <stop offset="78%" stop-color="#c0f800" stop-opacity="0.14"/>
              <stop offset="100%" stop-color="#ff8a80" stop-opacity="0.12"/>
            </linearGradient>
            <linearGradient id="rimInner" x1="0.15" y1="0" x2="0.9" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
              <stop offset="40%" stop-color="#7ec8ff" stop-opacity="0.08"/>
              <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
            </linearGradient>
          </defs>
          <rect x="1.2" y="1.2" width="297.6" height="357.6" rx="26" ry="26"
                fill="none" stroke="url(#rimSpec)" stroke-width="1.6"/>
          <rect x="3.5" y="3.5" width="293" height="353" rx="24" ry="24"
                fill="none" stroke="url(#rimInner)" stroke-width="0.8" opacity="0.85"/>
        </svg>
      </div>
      <div class="hero">
        <div class="mascot-wrap">
          <img class="mascot" src="/mascot.png" alt="" width="64" height="64" decoding="async"/>
          <span class="lock-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2.5"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
            </svg>
          </span>
        </div>
        <div class="mono kicker" id="kicker">vapurr</div>
        <div class="title-row">
          <svg class="lock-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2.5"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
          <h1 id="lock-title">Enter Passcode</h1>
        </div>
      </div>
      <p class="hint" id="hint">Unlock this wallet</p>

      <div class="dots" id="dots" aria-label="Passcode progress">
        <span class="dot" data-i="0"></span>
        <span class="dot" data-i="1"></span>
        <span class="dot" data-i="2"></span>
        <span class="dot" data-i="3"></span>
      </div>
    </div>

    <div class="pad" id="pad" aria-label="Number pad">
      <button class="key" type="button" data-d="1"><span>1</span></button>
      <button class="key" type="button" data-d="2"><span>2</span></button>
      <button class="key" type="button" data-d="3"><span>3</span></button>
      <button class="key" type="button" data-d="4"><span>4</span></button>
      <button class="key" type="button" data-d="5"><span>5</span></button>
      <button class="key" type="button" data-d="6"><span>6</span></button>
      <button class="key" type="button" data-d="7"><span>7</span></button>
      <button class="key" type="button" data-d="8"><span>8</span></button>
      <button class="key" type="button" data-d="9"><span>9</span></button>
      <button class="key ghost spacer" type="button" tabindex="-1" aria-hidden="true" disabled><span></span></button>
      <button class="key" type="button" data-d="0"><span>0</span></button>
      <button class="key ghost del" type="button" id="key-del" aria-label="Delete"><span aria-hidden="true">←</span></button>
    </div>

    <p class="foot" id="foot">Auto-locks after <b>15 min</b> idle by default.</p>
  </div>

  <script src="/ipc.js"></script>
  <script>
    (function () {
      var LEN = 4;
      var code = "";
      var pendingSet = "";
      var busy = false;
      var mode = "unlock";
      var visible = true;

      var dots = document.getElementById("dots");
      var hint = document.getElementById("hint");
      var title = document.getElementById("lock-title");
      var kicker = document.getElementById("kicker");
      var root = document.querySelector(".device");
      var pad = document.getElementById("pad");
      var led = document.getElementById("status-led");

      function setLed(state) {
        if (!led) return;
        led.setAttribute("data-state", state);
        led.setAttribute("aria-label", state === "ok" ? "Unlocked" : "Locked");
      }

      function haptic(pattern) {
        try {
          if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
            navigator.vibrate(pattern);
          }
        } catch (e) {}
      }

      function flashPress(el) {
        if (!el) return;
        el.classList.add("is-press");
        window.setTimeout(function () { el.classList.remove("is-press"); }, 120);
      }

      function paintDots(bad) {
        var nodes = dots.querySelectorAll(".dot");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].classList.toggle("on", i < code.length);
          nodes[i].classList.toggle("bad", !!bad && i < LEN);
        }
      }

      function setHint(text, isErr) {
        hint.textContent = text || "";
        hint.classList.toggle("err", !!isErr);
        hint.classList.toggle("ok", false);
      }

      function clearCode() {
        code = "";
        paintDots(false);
      }

      function clearPending() {
        pendingSet = "";
      }

      function shake() {
        haptic([40, 30, 60]);
        dots.classList.remove("shake", "ok-pulse");
        void dots.offsetWidth;
        dots.classList.add("shake");
        paintDots(true);
        window.setTimeout(function () {
          dots.classList.remove("shake");
          clearCode();
          busy = false;
        }, 420);
      }

      function paintMode() {
        if (mode === "set") {
          title.textContent = "Set Passcode";
          kicker.textContent = "secure wallet";
          setHint("Choose a 4-digit passcode", false);
        } else if (mode === "confirm") {
          title.textContent = "Confirm Passcode";
          kicker.textContent = "secure wallet";
          setHint("Enter the same passcode again", false);
        } else {
          mode = "unlock";
          title.textContent = "Enter Passcode";
          kicker.textContent = "vapurr";
          setHint("Unlock this wallet", false);
        }
      }

      function callSubmit(pin) {
        var fn = api.onSubmit || window.onSubmit;
        if (typeof fn === "function") {
          fn(pin);
          return true;
        }
        if (window.vapurr && vapurr.send) {
          vapurr.send({ cmd: "passcode-submit", code: pin, mode: mode });
          return true;
        }
        return false;
      }

      function finishFour() {
        if (busy || code.length !== LEN) return;
        busy = true;
        var pin = code;

        if (mode === "set") {
          haptic(18);
          pendingSet = pin;
          clearCode();
          mode = "confirm";
          paintMode();
          busy = false;
          return;
        }

        if (mode === "confirm") {
          var a = pendingSet;
          var b = pin;
          clearCode();
          clearPending();
          var setFn = api.onSetPin || window.onSetPin;
          if (typeof setFn === "function") {
            setFn(a, b);
          } else if (window.vapurr && vapurr.send) {
            vapurr.send({ cmd: "passcode-set", a: a, b: b });
          } else {
            callSubmit(b);
          }
          a = "";
          b = "";
          busy = false;
          return;
        }

        haptic(22);
        var ok = callSubmit(pin);
        clearCode();
        pin = "";
        if (!ok) {
          api.fail("Wire onSubmit(pin) in shell");
        }
      }

      function pushDigit(d) {
        if (busy || !visible) return;
        if (code.length >= LEN) return;
        haptic(12);
        code += String(d);
        paintDots(false);
        setLed("entering");
        if (code.length === LEN) {
          window.setTimeout(finishFour, 80);
        }
      }

      function del() {
        if (busy || !visible) return;
        if (!code.length) return;
        haptic(8);
        code = code.slice(0, -1);
        paintDots(false);
        setLed(code.length ? "entering" : "locked");
      }

      pad.addEventListener("pointerdown", function (e) {
        var t = e.target.closest(".key");
        if (t) flashPress(t);
      });

      pad.addEventListener("click", function (e) {
        var t = e.target.closest("[data-d], #key-del");
        if (!t) return;
        flashPress(t);
        if (t.id === "key-del") del();
        else if (t.getAttribute("data-d") != null) pushDigit(t.getAttribute("data-d"));
      });

      window.addEventListener("keydown", function (e) {
        if (busy || !visible) return;
        if (e.key >= "0" && e.key <= "9") {
          e.preventDefault();
          var btn = pad.querySelector('[data-d="' + e.key + '"]');
          flashPress(btn);
          pushDigit(e.key);
        } else if (e.key === "Backspace" || e.key === "Delete") {
          e.preventDefault();
          flashPress(document.getElementById("key-del"));
          del();
        } else if (e.key === "Escape") {
          e.preventDefault();
          clearCode();
        }
      });

      var api = {
        onSubmit: null,
        onUnlock: null,
        onSetPin: null,

        lock: function (opts) {
          opts = opts || {};
          visible = true;
          busy = false;
          clearCode();
          clearPending();
          mode = opts.mode || "unlock";
          paintMode();
          if (opts.title) title.textContent = opts.title;
          if (opts.hint) setHint(opts.hint, false);
          if (opts.kicker) kicker.textContent = opts.kicker;
          if (root) root.style.display = "";
          setLed("locked");
        },

        unlock: function () {
          busy = false;
          haptic([20, 40, 35]);
          dots.classList.remove("shake");
          dots.classList.add("ok-pulse");
          hint.classList.remove("err");
          hint.classList.add("ok");
          hint.textContent = "Unlocked";
          setLed("ok");
          clearCode();
          clearPending();
          var fn = api.onUnlock || window.onUnlock;
          if (typeof fn === "function") fn();
        },

        fail: function (msg) {
          busy = true;
          setHint(msg || "Wrong passcode. Try again.", true);
          setLed("fail");
          shake();
          window.setTimeout(function () { if (led && led.getAttribute("data-state") === "fail") setLed("locked"); }, 520);
        },

        setMode: function (m) {
          mode = m || "unlock";
          clearCode();
          if (mode !== "confirm") clearPending();
          paintMode();
        }
      };

      window.VapurrLock = api;
      window.lock = function (opts) { return api.lock(opts); };
      window.__passcodeFail = function (msg) { api.fail(msg); };
      window.__passcodeOk = function () { api.unlock(); };
      window.__passcodePaint = function (s) {
        s = s || {};
        api.lock({ mode: s.mode, title: s.title, hint: s.hint, kicker: s.kicker });
      };
      window.__passcodeReset = function () { clearCode(); busy = false; };

      (function boot() {
        var q = (location.search || "").replace(/^\?/, "");
        var m = "unlock";
        q.split("&").forEach(function (p) {
          var kv = p.split("=");
          if (kv[0] === "mode" && kv[1]) m = decodeURIComponent(kv[1]);
        });
        api.lock({ mode: m });
      })();

      /* Liquid-glass cipher field — light glyphs with depth parallax + refraction catch */
      (function cryptoGlass() {
        var canvas = document.getElementById("crypto-viz");
        if (!canvas || !canvas.getContext) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        var ctx = canvas.getContext("2d");
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var layers = [];
        var sparks = [];
        var running = true;
        var last = 0;
        var HEX = "0123456789abcdef";
        var GLYPHS = "0123456789abcdef¤§¶†‡◊∆∇∞≈≠≤≥⊕⊗⊙◈◇◆◇○●◎◌";
        var TAGS = ["sha256", "keccak", "hmac", "aes-gcm", "x25519", "secp256k1", "argon2id", "chacha20"];

        function randHex(n) {
          var s = "";
          for (var i = 0; i < n; i++) s += HEX[(Math.random() * 16) | 0];
          return s;
        }

        function randGlyph() {
          if (Math.random() < 0.72) return randHex(2);
          return GLYPHS.charAt((Math.random() * GLYPHS.length) | 0);
        }

        function resize() {
          var screen = canvas.parentElement;
          if (!screen) return;
          var w = screen.clientWidth;
          var h = screen.clientHeight;
          canvas.width = Math.max(1, Math.floor(w * dpr));
          canvas.height = Math.max(1, Math.floor(h * dpr));
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          buildField(w, h);
        }

        function buildField(w, h) {
          layers = [
            { depth: 0.35, cols: [], alpha: 0.14, size: 9, speedMul: 0.45 },
            { depth: 0.7, cols: [], alpha: 0.28, size: 10, speedMul: 0.85 },
            { depth: 1.0, cols: [], alpha: 0.48, size: 11, speedMul: 1.25 }
          ];
          for (var L = 0; L < layers.length; L++) {
            var layer = layers[L];
            var n = Math.max(5, Math.floor(w / (36 - L * 4)));
            for (var i = 0; i < n; i++) {
              layer.cols.push({
                x: (i + 0.35 + Math.random() * 0.3) * (w / n),
                y: Math.random() * h,
                speed: (10 + Math.random() * 22) * layer.speedMul,
                glyphs: (function () {
                  var g = [];
                  var len = 8 + ((Math.random() * 8) | 0);
                  for (var j = 0; j < len; j++) g.push(randGlyph());
                  return g;
                })(),
                accent: Math.random() < 0.14,
                tag: Math.random() < 0.12 ? TAGS[(Math.random() * TAGS.length) | 0] : null,
                phase: Math.random() * Math.PI * 2
              });
            }
          }
          sparks = [];
          for (var k = 0; k < 18; k++) {
            sparks.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: 0.5 + Math.random() * 1.6,
              vx: -8 + Math.random() * 16,
              vy: -12 + Math.random() * 8,
              a: 0.12 + Math.random() * 0.4,
              chroma: Math.random()
            });
          }
        }

        function tick(ts) {
          if (!running) return;
          var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
          last = ts;
          var w = canvas.clientWidth;
          var h = canvas.clientHeight;
          ctx.clearRect(0, 0, w, h);

          /* NO milky void wash — only a whisper of depth so glass stays clear */
          ctx.fillStyle = "rgba(10,14,18,0.06)";
          ctx.fillRect(0, 0, w, h);

          var lightX = w * (0.18 + 0.04 * Math.sin(ts * 0.00035));
          var lightY = h * (0.08 + 0.03 * Math.cos(ts * 0.00028));

          ctx.textAlign = "center";

          for (var L = 0; L < layers.length; L++) {
            var layer = layers[L];
            var parallax = (lightX - w * 0.5) * (1 - layer.depth) * 0.04;
            ctx.font = layer.size + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

            for (var i = 0; i < layer.cols.length; i++) {
              var c = layer.cols[i];
              c.y += c.speed * dt;
              var sway = Math.sin(ts * 0.0006 + c.phase) * (2.2 + layer.depth * 2);
              var step = 12 + layer.depth * 2;
              var total = c.glyphs.length * step;
              if (c.y - total > h + 20) {
                c.y = -20 - Math.random() * h * 0.3;
                c.speed = (10 + Math.random() * 22) * layer.speedMul;
                c.accent = Math.random() < 0.14;
                if (Math.random() < 0.3) {
                  for (var r = 0; r < c.glyphs.length; r++) c.glyphs[r] = randGlyph();
                }
                c.tag = Math.random() < 0.12 ? TAGS[(Math.random() * TAGS.length) | 0] : null;
              }
              var cx = c.x + sway + parallax;
              for (var j = 0; j < c.glyphs.length; j++) {
                var gy = c.y - j * step;
                if (gy < -14 || gy > h + 14) continue;
                var fade = 1 - j / c.glyphs.length;
                /* light catch: brighter near specular highlight */
                var dx = cx - lightX;
                var dy = gy - lightY;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var catchL = Math.max(0, 1 - dist / (w * 0.55));
                var baseA = layer.alpha * fade * (0.55 + 0.45 * catchL);

                if (c.accent && j === 0) {
                  ctx.fillStyle = "rgba(192,248,0," + (baseA * 1.15).toFixed(3) + ")";
                  ctx.shadowColor = "rgba(192,248,0,0.35)";
                  ctx.shadowBlur = 6 * layer.depth;
                } else if (catchL > 0.55 && j < 2) {
                  /* refractive fringe near specular */
                  ctx.fillStyle = "rgba(180,220,255," + (baseA * 1.05).toFixed(3) + ")";
                  ctx.shadowColor = "rgba(126,200,255,0.25)";
                  ctx.shadowBlur = 4 * layer.depth;
                } else {
                  ctx.fillStyle = "rgba(190,210,220," + baseA.toFixed(3) + ")";
                  ctx.shadowBlur = 0;
                }
                ctx.fillText(c.glyphs[j], cx, gy);
                ctx.shadowBlur = 0;
              }
              if (c.tag && layer.depth > 0.6) {
                ctx.fillStyle = "rgba(192,248,0," + (0.12 * layer.alpha * 2).toFixed(3) + ")";
                ctx.font = (layer.size - 1) + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
                ctx.fillText(c.tag, cx, c.y + 14);
                ctx.font = layer.size + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
              }
            }
          }

          for (var s = 0; s < sparks.length; s++) {
            var p = sparks[s];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.x < -4 || p.x > w + 4 || p.y < -4 || p.y > h + 4) {
              p.x = Math.random() * w;
              p.y = h + 4;
              p.vy = -8 - Math.random() * 14;
              p.vx = -8 + Math.random() * 16;
              p.chroma = Math.random();
            }
            var col = p.chroma < 0.33
              ? "rgba(192,248,0,"
              : p.chroma < 0.66
                ? "rgba(126,200,255,"
                : "rgba(255,255,255,";
            ctx.beginPath();
            ctx.fillStyle = col + p.a.toFixed(3) + ")";
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }

          /* slow hash ribbon drifting through the glass */
          if (!canvas._ribbon || ts - (canvas._ribbonAt || 0) > 2200) {
            canvas._ribbon = "0x" + randHex(40);
            canvas._ribbonAt = ts;
          }
          ctx.fillStyle = "rgba(170,200,220,0.10)";
          ctx.font = "9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
          ctx.textAlign = "left";
          var ribbonY = ((ts * 0.016) % (h + 40)) - 20;
          ctx.fillText(canvas._ribbon, 10, ribbonY);

          requestAnimationFrame(tick);
        }

        resize();
        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", function () {
          running = document.visibilityState !== "hidden";
          if (running) {
            last = performance.now();
            requestAnimationFrame(tick);
          }
        });
        requestAnimationFrame(tick);
      })();
    })();
  </script>
</body>
</html>
