<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>404</title>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <style>
    body { overflow: auto; }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 24px 72px;
      text-align: center;
    }
    .hero {
      width: min(100%, 480px);
      height: auto;
      display: block;
      margin: 0 auto 18px;
      pointer-events: none;
      user-select: none;
    }
    .kicker {
      color: var(--color-lime);
      letter-spacing: 0.22em;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 44px;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin: 0 0 6px;
    }
    .lead {
      color: var(--color-muted);
      margin: 0 auto 28px;
      max-width: 380px;
      line-height: 1.5;
    }
    .pay-box {
      text-align: left;
      padding: 22px 22px 24px;
    }
    .amt {
      font-size: 36px;
      font-weight: 600;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--color-forest);
      color: var(--color-snow);
      width: 100%;
      padding: 8px 0 12px;
      margin-bottom: 16px;
      outline: none;
    }
    .amt:focus { border-bottom-color: var(--color-lime); }
    .meta {
      display: flex;
      justify-content: space-between;
      color: var(--color-muted);
      font-size: 13px;
      margin-bottom: 20px;
    }
    .btn { width: 100%; height: 48px; font-size: 15px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="hero" src="/404.png" alt="404"/>
    <div class="mono kicker">PAYMENTS</div>
    <h1>404</h1>
    <p class="lead">Pay any site in $PUSD. HTTP 402 / x402 v2. The page was never missing — it was waiting to get paid. Does not settle yet.</p>
    <div class="steel pay-box">
      <input class="amt" id="amount" value="$24.00" inputmode="decimal" aria-label="amount"/>
      <div class="meta"><span>$PUSD</span><span>x402 v2</span></div>
      <button class="btn" id="pay" type="button">Review in Wallet</button>
    </div>
  </div>
  <script src="/ipc.js"></script>
  <script>
    document.getElementById("pay").onclick = function () {
      vapurr.send({ cmd: "pane", id: "wallet" });
    };
  </script>
</body>
</html>
