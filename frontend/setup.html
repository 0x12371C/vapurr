<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="color-scheme" content="dark"/>
  <title>Install vapurr</title>
  <link rel="preload" href="/fonts/Sora-SemiBold.ttf" as="font" type="font/ttf" crossorigin/>
  <link rel="preload" href="/setup-mascot.png" as="image" fetchpriority="high"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--color-void);
      color: var(--color-snow);
      cursor: default !important;
      -webkit-font-smoothing: antialiased;
    }
    html, body, button, label, input { cursor: default !important; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 36px 28px;
    }
    .mascot {
      width: 148px;
      height: auto;
      display: block;
      margin: 0 auto 18px;
      user-drag: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      text-align: center;
    }
    .tag {
      margin-top: 8px;
      text-align: center;
      color: var(--color-muted);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }
    form {
      width: 280px;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      height: 44px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--color-lime);
      color: var(--color-on-lime);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .btn:hover { filter: brightness(1.04); }
    .btn:active { transform: scale(0.98); }
    .btn[disabled] { filter: none; opacity: 0.55; }
    .track {
      display: none;
      height: 3px;
      width: 100%;
      border-radius: 99px;
      background: var(--color-steel);
      overflow: hidden;
    }
    .track.on { display: block; }
    .track i {
      display: block;
      height: 100%;
      width: 36%;
      border-radius: 99px;
      background: var(--color-lime);
      animation: indet 1.1s ease-in-out infinite;
    }
    @keyframes indet {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }
    .desk {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--color-snow);
      font-size: 13px;
    }
    .desk input {
      appearance: none;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
      border: 1.5px solid var(--color-muted);
      background: transparent;
      display: grid;
      place-items: center;
    }
    .desk input:checked {
      border-color: var(--color-lime);
      background: var(--color-lime);
    }
    .desk input:checked::after {
      content: "";
      width: 8px;
      height: 5px;
      border-left: 2px solid var(--color-on-lime);
      border-bottom: 2px solid var(--color-on-lime);
      transform: rotate(-45deg) translate(0, -1px);
    }
    .err {
      min-height: 16px;
      font-size: 12px;
      color: #ff8a80;
      text-align: center;
    }
    .ver {
      margin-top: 22px;
      font-size: 11px;
      color: var(--color-muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <img class="mascot" src="/setup-mascot.png" alt="" width="148" height="159"/>
  <div class="name">vapurr</div>
  <p class="tag">Browse. Own. Spend.</p>
  <form id="form">
    <button class="btn" id="go" type="submit">Install</button>
    <div class="track" id="track"><i></i></div>
    <label class="desk" id="desk-row">
      <input type="checkbox" id="desk" checked/>
      Desktop shortcut
    </label>
    <p class="err" id="err"></p>
  </form>
  <p class="ver" id="ver"></p>
  <script>
    var info = { installed: false, dest: "", version: "" };
    var busy = false;
    function api(path) {
      return fetch("/setup/api/" + path, { cache: "no-store" }).then(function (r) { return r.json(); });
    }
    function post(msg) {
      try { if (window.__vapurrPost) window.__vapurrPost(msg); } catch (e) {}
    }
    function paint() {
      var go = document.getElementById("go");
      var row = document.getElementById("desk-row");
      var ver = document.getElementById("ver");
      ver.textContent = info.version ? info.version : "";
      if (info.installed) {
        go.textContent = "Open";
        row.style.display = "none";
      } else {
        go.textContent = "Install";
        row.style.display = "";
      }
    }
    function fail(msg) {
      busy = false;
      document.getElementById("track").className = "track";
      var go = document.getElementById("go");
      go.disabled = false;
      go.textContent = info.installed ? "Open" : "Install";
      document.getElementById("err").textContent = msg || "Couldn't install. Try again.";
    }
    function run() {
      if (busy) return;
      var go = document.getElementById("go");
      document.getElementById("err").textContent = "";
      busy = true;
      go.disabled = true;
      if (info.installed) {
        go.textContent = "Opening";
        post({ cmd: "setup-launch" });
        api("launch").then(function (s) {
          if (s && s.error) fail(s.error);
        }).catch(function () { fail("Couldn't open vapurr."); });
        return;
      }
      go.textContent = "Installing";
      document.getElementById("track").className = "track on";
      var desk = document.getElementById("desk").checked;
      post({ cmd: "setup-install", desktop: desk });
      api("install/" + (desk ? "1" : "0")).then(function (s) {
        if (s && s.error) fail(s.error);
      }).catch(function () {});
    }
    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      run();
    };
    document.getElementById("go").focus();
    api("info").then(function (s) {
      if (s) info = s;
      paint();
    }).catch(function () { paint(); });
  </script>
</body>
</html>
