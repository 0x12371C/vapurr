<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Swap</title>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <link rel="stylesheet" href="/route.css"/>
</head>
<body>
  <div class="globe-layer" aria-hidden="true"><canvas id="globe"></canvas></div>
  <div class="wrap">
    <div class="hero">
      <div class="mono">SWAP</div>
      <h1 id="receive" hidden></h1>
      <p class="lede">Full route. House kicks back 0.03% in $VAPURR. This device simulates, then you sign.</p>
      <div class="meta">
        <div class="chip"><span>Refund</span><b id="chip-refund">0.03%</b></div>
        <div class="chip"><span>Sim</span><b id="chip-sim">idle</b></div>
        <div class="chip"><span>Route</span><b id="chip-hops">—</b></div>
      </div>
    </div>

    <div class="ticket">
      <div class="pair">
        <div class="leg">
          <div class="leg-head"><span class="mono">You pay</span><button type="button" class="max" id="from-max">MAX</button></div>
          <div class="leg-row">
            <input class="amt" id="amt" placeholder="0" inputmode="decimal"/>
            <button class="tok" id="from-tok" type="button"></button>
          </div>
          <div class="bal" id="from-bal"></div>
        </div>
        <button class="flip" id="flip" type="button" aria-label="flip">
          <svg class="ico" viewBox="0 0 24 24"><path d="M8 6v12M8 18l-3-3M16 18V6M16 6l3 3"/></svg>
        </button>
        <div class="leg">
          <div class="leg-head"><span class="mono">You get</span></div>
          <div class="leg-row">
            <div class="get" id="to-amt">0</div>
            <button class="tok" id="to-tok" type="button"></button>
          </div>
          <div class="bal" id="to-bal"></div>
        </div>
      </div>
      <div class="quote" id="route"></div>
    </div>
    <button class="btn go" type="button" id="go" disabled>Swap</button>
  </div>
  <div id="tok-sheet" hidden>
    <div class="dimmer" id="tok-dim"></div>
    <div class="tok-card">
      <div class="mono">Token</div>
      <div id="tok-list"></div>
    </div>
  </div>
  <script src="/ipc.js"></script>
  <script src="/sign.js"></script>
  <script src="/tokens.js"></script>
  <script src="/route.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.webgpu.min.js",
      "three/webgpu": "/vendor/three.webgpu.min.js",
      "three/tsl": "/vendor/three.tsl.min.js"
    }
  }
  </script>
  <script type="module">
    import { startSwap } from "/globe.js?v=gyre";
    startSwap(document.getElementById("globe"));
  </script>
  <script>bootRoute({ mode: "swap" });</script>
</body>
</html>
