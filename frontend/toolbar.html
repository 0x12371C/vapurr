<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/chrome.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      padding: 0;
      height: 100%;
      border-bottom: 1px solid color-mix(in srgb, var(--color-snow) 8%, transparent);
    }
    .strip {
      display: flex;
      align-items: stretch;
      height: 36px;
      padding: 0 8px 0 6px;
      gap: 4px;
      background: color-mix(in srgb, var(--color-void) 82%, var(--color-steel));
      border-bottom: 1px solid color-mix(in srgb, var(--color-snow) 8%, transparent);
      flex-shrink: 0;
    }
    .tabs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 10px 0 8px;
      flex-shrink: 0;
    }
    .nav { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      width: 30px; height: 30px; border: 0; background: transparent;
      color: var(--color-snow); border-radius: 8px; display: grid; place-items: center; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--color-forest); }
    .icon-btn:hover svg { stroke: var(--color-lime); }
    .icon-btn.on svg { stroke: var(--color-lime); }
    #star.on svg { fill: var(--color-lime); stroke: var(--color-lime); }
    #boost {
      width: auto;
      height: 30px;
      padding: 0 8px 0 6px;
      gap: 6px;
      display: flex;
      align-items: center;
      border: 1px solid var(--color-forest);
      border-radius: 8px;
      flex-shrink: 0;
    }
    #boost svg { stroke: var(--color-snow); width: 15px; height: 15px; }
    #boost:hover svg { stroke: var(--color-lime); }
    #boost .lab {
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--color-snow);
      font-weight: 600;
    }
    #boost .sw {
      width: 28px;
      height: 16px;
      border-radius: 999px;
      background: var(--color-void);
      border: 1px solid var(--color-forest);
      position: relative;
      flex-shrink: 0;
    }
    #boost .sw i {
      position: absolute;
      top: 1px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-muted);
      display: block;
    }
    #boost.on {
      background: var(--color-lime);
      border-color: var(--color-lime);
    }
    #boost.on svg { stroke: var(--color-void); fill: var(--color-void); }
    #boost.on .lab { color: var(--color-void); }
    #boost.on .sw { background: var(--color-void); border-color: var(--color-void); }
    #boost.on .sw i { left: 12px; background: var(--color-lime); }
    @keyframes boost-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    #boost.pop { animation: boost-pop 0.45s ease-out; }
    .icon-btn svg {
      width: 17px; height: 17px; stroke: var(--color-snow); fill: none;
      stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
    }
    .tab {
      height: auto; padding: 0 8px 0 10px; border: 0;
      background: transparent; color: var(--color-muted);
      border-radius: 8px 8px 0 0;
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      max-width: 180px; min-width: 88px; flex: 0 0 auto;
      position: relative;
    }
    .tab:hover { background: color-mix(in srgb, var(--color-forest) 55%, transparent); color: var(--color-snow); }
    .tab.active {
      background: var(--color-steel); color: var(--color-snow);
    }
    .tab.active::after {
      content: "";
      position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px;
      background: var(--color-lime); border-radius: 2px 2px 0 0;
    }
    .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-muted); flex-shrink: 0; }
    .tab.active .dot { background: var(--color-lime); }
    .tab .x {
      border: 0; background: transparent; color: inherit;
      width: 16px; height: 16px; border-radius: 4px; opacity: 0;
      font-size: 14px; line-height: 1; flex-shrink: 0;
    }
    .tab:hover .x, .tab.active .x { opacity: 0.7; }
    .tab .x:hover { color: var(--color-lime); opacity: 1; background: var(--color-forest); }
    .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    form { display: flex; flex: 1; min-width: 0; }
    #url {
      flex: 1; height: 32px; border-radius: 10px; padding: 0 12px 0 34px; font-size: 13px; outline: none;
      color: color-mix(in srgb, var(--color-snow) 88%, var(--color-lime) 12%);
      caret-color: var(--color-lime);
      border: 1px solid var(--color-forest);
      background-color: var(--color-steel);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238aa090' stroke-width='2.1'><circle cx='11' cy='11' r='6'/><path d='M16 16l4 4'/></svg>");
      background-repeat: no-repeat;
      background-position: 10px 50%;
      background-size: 15px;
      text-shadow: 0 0 8px color-mix(in srgb, var(--color-lime) 14%, transparent);
      transition: border-color 0.15s ease;
    }
    #url::placeholder {
      color: var(--color-muted);
      text-shadow: none;
    }
    #url:focus { border-color: var(--color-lime); }
    #findwrap { display: none; align-items: center; gap: 4px; }
    #findwrap.on { display: flex; }
    #find {
      width: 140px; height: 30px; border: 1px solid var(--color-lime); background: var(--color-steel);
      color: var(--color-snow); border-radius: 8px; padding: 0 10px; font-size: 12px; outline: none;
    }
    .chain {
      height: 28px; padding: 0 8px; border: 1px solid var(--color-forest); border-radius: 8px;
      display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.04em;
      color: var(--color-muted); white-space: nowrap; flex-shrink: 0;
    }
    .chain.on { color: var(--color-snow); }
    .chain .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-lime); opacity: 0.35; }
    .chain.on .dot { opacity: 1; }
    #gas {
      height: 28px; padding: 0 8px; border: 1px solid var(--color-forest); border-radius: 8px;
      background: transparent; color: var(--color-muted); font-size: 11px; letter-spacing: 0.04em;
      flex-shrink: 0; white-space: nowrap;
    }
    #gas:hover, #gas.on { color: var(--color-snow); border-color: var(--color-lime); }
    .zoom {
      height: 28px; min-width: 44px; padding: 0 8px; border: 1px solid var(--color-forest);
      background: transparent; color: var(--color-muted); border-radius: 8px;
      font-size: 11px; letter-spacing: 0.04em; flex-shrink: 0; display: none;
    }
    .zoom.on { display: block; }
    .zoom:hover { color: var(--color-lime); background: var(--color-forest); }
  </style>
</head>
<body>
  <div class="strip">
    <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
    <button class="icon-btn" id="newtab" title="New tab" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
  </div>
  <div class="bar">
  <div class="nav">
    <button class="icon-btn" id="back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="icon-btn" id="fwd" title="Forward"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="icon-btn" id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.2 5.5"/><path d="M20 12v-5h-5"/></svg></button>
  </div>
  <form id="nav"><input id="url" placeholder="Search the chain or type a command" spellcheck="false"/></form>
  <div id="findwrap">
    <input id="find" placeholder="Find in page"/>
  </div>
  <button class="icon-btn" id="star" title="Bookmark"><svg viewBox="0 0 24 24"><path d="M12 3l2.4 6.8H21l-5.4 4.2 2 7-5.6-4.2L6.4 21l2-7L3 9.8h6.6z"/></svg></button>
  <button class="icon-btn" id="boost" type="button" aria-pressed="false"
    title="Boost">
    <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 10-14h-7l1-6z"/></svg>
    <span class="lab">Boost</span>
    <span class="sw" aria-hidden="true"><i></i></span>
  </button>
  <button class="zoom on" id="zoom" title="Zoom">100%</button>
  <button class="icon-btn" id="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.2a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.2a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.2a1.7 1.7 0 001.1 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9c.3.6.9 1 1.5 1.1H21a2 2 0 110 4h-.2a1.7 1.7 0 00-1.4.9z"/></svg></button>
  <button type="button" id="gas" title="Gas meter — open Scan">— gwei</button>
  <div class="chain" id="chain" title="Robinhood Chain"><span class="dot"></span><span id="chain-label">RHC</span></div>
  </div>
  <script src="/ipc.js"></script>
  <script>
    var input = document.getElementById("url");
    var find = document.getElementById("find");
    document.getElementById("nav").addEventListener("submit", function (e) {
      e.preventDefault();
      vapurr.go(input.value);
    });
    document.getElementById("back").onclick = function () { vapurr.send({ cmd: "back" }); };
    document.getElementById("fwd").onclick = function () { vapurr.send({ cmd: "forward" }); };
    document.getElementById("reload").onclick = function () { vapurr.send({ cmd: "reload" }); };
    document.getElementById("newtab").onclick = function () { vapurr.send({ cmd: "newtab" }); };
    document.getElementById("star").onclick = function () { vapurr.send({ cmd: "star" }); };
    var boostBtn = document.getElementById("boost");
    window.__setBoost = function (on) {
      var b = document.getElementById("boost");
      if (!b) return;
      b.classList.toggle("on", !!on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.title = on ? "Boost on" : "Boost";
    };
    window.__onBoost = function (s) {
      window.__setBoost(!!(s && s.on));
      var b = document.getElementById("boost");
      if (!b) return;
      b.classList.remove("pop");
      void b.offsetWidth;
      b.classList.add("pop");
    };
    boostBtn.onclick = function () {
      var on = !boostBtn.classList.contains("on");
      window.__setBoost(on);
      window.__onBoost({ on: on });
      vapurr.send({ cmd: "boost" });
    };
    document.getElementById("settings").onclick = function () { vapurr.togglePane("settings"); };
    document.getElementById("zoom").onclick = function () { vapurr.togglePane("settings"); };
    window.__setZoom = function (pct, show) {
      var z = document.getElementById("zoom");
      if (!z) return;
      z.textContent = (pct || 100) + "%";
      z.classList.toggle("on", show !== false);
    };
    find.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        vapurr.send({ cmd: "find", q: find.value });
      }
      if (e.key === "Escape") {
        document.getElementById("findwrap").classList.remove("on");
        input.focus();
      }
    });
    window.__focusUrl = function () { input.focus(); input.select(); };
    window.__showFind = function () {
      document.getElementById("findwrap").classList.add("on");
      find.focus();
      find.select();
    };
    window.__setStar = function (on) {
      var s = document.getElementById("star");
      s.classList.toggle("on", !!on);
      s.title = on ? "Bookmarked" : "Bookmark";
    };
    window.__setChain = function (snap) {
      var chip = document.getElementById("chain");
      var lab = document.getElementById("chain-label");
      if (!chip || !lab || !snap) return;
      if (snap.ok && snap.block) {
        chip.classList.add("on");
        lab.textContent = "RHC " + snap.block;
      } else {
        chip.classList.remove("on");
        lab.textContent = "RHC";
      }
      var g = document.getElementById("gas");
      if (g) {
        var txt = (snap.gwei || "").replace(/\s*GWEI/i, "").trim();
        g.textContent = txt ? txt + " gwei" : "gas";
        g.classList.toggle("on", !!snap.ok);
        g.title = snap.gwei ? ("Gas " + snap.gwei + " — open meter") : "Gas meter";
      }
    };
    document.getElementById("gas").onclick = function () {
      vapurr.send({ cmd: "pane", id: "gas" });
    };
    window.__setUrl = function (url) {
      if (!url || url.indexOf("vapurr.localhost") !== -1 || url.indexOf("vapurr://") === 0) {
        input.value = "";
        return;
      }
      input.value = url;
    };
    window.__setTabs = function (state) {
      var box = document.getElementById("tabs");
      box.innerHTML = "";
      (state.tabs || []).forEach(function (t) {
        var b = document.createElement("button");
        b.className = "tab" + (t.id === state.active ? " active" : "");
        b.type = "button";
        b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", t.id === state.active ? "true" : "false");
        b.title = t.title || "Tab";
        var dot = document.createElement("span");
        dot.className = "dot";
        var name = document.createElement("span");
        name.className = "tab-title";
        name.textContent = t.title || "Tab";
        var x = document.createElement("span");
        x.className = "x";
        x.setAttribute("aria-label", "Close");
        x.textContent = "×";
        b.appendChild(dot);
        b.appendChild(name);
        b.appendChild(x);
        b.onclick = function (e) {
          if (e.target === x) {
            e.stopPropagation();
            vapurr.send({ cmd: "closetab", id: t.id });
            return;
          }
          vapurr.send({ cmd: "selecttab", id: t.id });
        };
        b.onauxclick = function (e) {
          if (e.button === 1) {
            e.preventDefault();
            vapurr.send({ cmd: "closetab", id: t.id });
          }
        };
        box.appendChild(b);
      });
      var on = box.querySelector(".tab.active");
      if (on && on.scrollIntoView) on.scrollIntoView({ inline: "nearest", block: "nearest" });
    };
  </script>
</body>
</html>
